<style>
:root{--paper:#f7f8fb;--sheet:#fff;--grid:#e6eaf2;--ink:#1b2333;--muted:#5d6779;--line:#d5dbe6;--accent:#2747a0;--artery:#b3263b;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--paper:#11151d;--sheet:#181d27;--grid:#1d2330;--ink:#e7ebf3;--muted:#9aa4b6;--line:#2c3443;--accent:#8fa8f0;--artery:#f07a8a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible","Helvetica Neue",Arial,sans-serif;padding:28px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font:800 clamp(28px,5vw,40px)/1.15 "Bricolage Grotesque","Avenir Next",system-ui,sans-serif;margin:0}
.eyebrow{font:700 12px/1 inherit;letter-spacing:.12em;text-transform:uppercase;color:var(--artery)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:22px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li a{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);background:var(--paper)}
li a:hover{border-color:var(--accent)}
li b{color:var(--accent)}
.muted{color:var(--muted);font-size:15px}
a{color:var(--accent)}
</style>
</head>
<body>
