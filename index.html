(function(){
"use strict";
const KEY = "practice-quiz:" + QUIZ.title;
const TOP = Object.fromEntries(QUIZ.topics.map(t=>[t.id,t]));
const CON = Object.fromEntries(QUIZ.concepts.map(c=>[c.id,c]));
const LETTERS = "ABCD";
document.title = QUIZ.title + " · Practice Quiz";

let S = load() || {history:[], lastVariant:{}, round:null, view:"home", filter:"all", mastery:false};
// If the question bank changed since last visit, drop any round that refers to removed questions.
if(S.round && S.round.items.some(it=>!CON[it.cid] || !CON[it.cid].qs[it.vi])){ S.round=null; S.view="home"; }
const termOf = c => c.term || c.name;
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const pct = (a,b)=> b? Math.round(100*a/b) : 0;

function variantFor(cid, fresh){
  const c = CON[cid], n = c.qs.length;
  if(!fresh) return 0;
  const last = S.lastVariant[cid];
  return last==null ? 0 : (last+1)%n;
}
function makeItem(cid, vi){ return {cid, vi, order: shuffle([0,1,2,3])}; }

function newRound(kind, items, label){
  items.forEach(it=>{ S.lastVariant[it.cid]=it.vi; });
  const num = S.history.length + 1;
  S.round = {kind, label, num, items, answers:{}, pos:0, submitted:false, started:Date.now()};
  S.view = "quiz"; S.filter="all";
  save(); render(); window.scrollTo(0,0);
}
function startFull(fresh, cids){
  cids = cids || QUIZ.concepts.map(c=>c.id);
  const first = !S.history.length && !fresh;
  const items = cids.map(cid=> makeItem(cid, first ? 0 : variantFor(cid, true)));
  newRound(cids.length===QUIZ.concepts.length ? "full" : "subset", items,
    cids.length===QUIZ.concepts.length ? (first ? "Full test" : "Full test · new questions") : "Chosen lessons · new questions");
}

/* Fresh start: wipe history, pick a random version of every question
   (different from the last one he saw), and begin a full test. */
function startOver(){
  const items = QUIZ.concepts.map(c=>{
    const n=c.qs.length, last=S.lastVariant[c.id];
    let vi=Math.floor(Math.random()*n);
    if(n>1 && vi===last) vi=(vi+1+Math.floor(Math.random()*(n-1)))%n;
    return makeItem(c.id, vi);
  });
  S.history=[]; S.lastVariant={};
  newRound("full", items, "Fresh start");
}

/* ---------- views ---------- */
function render(){
  const app = $("#app");
  if(S.view==="quiz" && S.round && !S.round.submitted) app.innerHTML = viewQuiz();
  else if(S.view==="results" && S.round && S.round.submitted) app.innerHTML = viewResults();
  else { S.view="home"; app.innerHTML = viewHome(); }
  bind();
}

function header(){
  return `<header class="spread"><div><div class="eyebrow">${esc(QUIZ.subtitle)}</div><h1>${esc(QUIZ.title)}</h1></div></header>`;
}
function lessonsList(withCounts){
  return `<ul class="lesson-list">${QUIZ.topics.map(t=>{
    const n = QUIZ.concepts.filter(c=>c.t===t.id).length;
    return `<li><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)} ↗</a>${withCounts?`<span class="count">${n} Q</span>`:""}</li>`;}).join("")}</ul>`;
}
function historyTable(){
  if(!S.history.length) return "";
  return `<section class="sheet"><h2>Attempt history</h2><div style="overflow-x:auto;margin-top:10px"><table class="hist"><thead><tr><th>#</th><th>Round</th><th>Score</th><th>When</th></tr></thead><tbody>${
    S.history.slice().reverse().map(h=>`<tr><td>${h.num}</td><td>${esc(h.label)}</td><td><b>${h.right}/${h.total}</b> · ${pct(h.right,h.total)}%</td><td class="muted">${new Date(h.when).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</td></tr>`).join("")
  }</tbody></table></div></section>`;
}
function viewHome(){
  const total = QUIZ.concepts.length;
  const r = S.round, resumable = r && !r.submitted;
  return `${header()}
  ${resumable?`<div class="banner spread"><div><b>Quiz in progress:</b> ${esc(r.label)}, ${Object.keys(r.answers).length} of ${r.items.length} answered.</div><button class="btn small" data-act="resume">Keep going</button></div>`:""}
  <section class="sheet" style="display:flex;flex-direction:column;gap:16px">
    <p style="margin:0">${total} multiple-choice questions, one for each <b>bold or highlighted key term</b> in these ${QUIZ.topics.length} lessons. It's open book: each question tells you which lesson to look in, and the lesson name is a link.</p>
    ${lessonsList(true)}
    <div class="row">
      <button class="btn" data-act="start">${S.history.length?"Start a new full test":"Start the test"}</button>
      <button class="btn ghost" data-act="choose">Choose lessons</button>
      <button class="btn ghost" data-act="printall">Print study notes</button>
      ${S.history.length?`<button class="btn ghost" data-act="scratchask">Start over from scratch</button>`:""}
    </div>
    <div id="scratchconfirm" hidden class="notice"><span>This clears all scores and history and starts a brand-new full test.</span><button class="btn small" data-act="scratch">Yes, start over</button><button class="btn small ghost" data-act="scratchno">Cancel</button></div>
    <div id="chooser" hidden>${subsetPicker(null)}<div class="row" style="margin-top:10px"><button class="btn small" data-act="startsubset">Start with these lessons</button></div></div>
    <p class="muted" style="margin:0;font-size:15px">Tip: press <kbd>A</kbd>–<kbd>D</kbd> to answer and <kbd>←</kbd> <kbd>→</kbd> to move between questions. Your progress is saved in this browser if you close the page.</p>
  </section>
  ${historyTable()}`;
}

function viewQuiz(){
  const r = S.round, it = r.items[r.pos], c = CON[it.cid], q = c.qs[it.vi], t = TOP[c.t];
  const choices = [q[1], ...q[2]];
  const answered = Object.keys(r.answers).length, sel = r.answers[r.pos];
  const unanswered = r.items.length - answered;
  return `${header()}
  <section class="sheet">
    <div class="spread"><b>${esc(r.label)}</b><span class="count">Question ${r.pos+1} of ${r.items.length} · ${answered} answered</span></div>
    <div class="progress" style="margin-top:10px"><i style="width:${pct(answered,r.items.length)}%"></i></div>
  </section>
  <section class="sheet">
    <div class="qtopic"><span class="muted">Look in:</span><a class="chip" href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)} ↗</a></div>
    <div class="qtext" id="qtext">${esc(q[0])}</div>
    <div class="choices" role="radiogroup" aria-labelledby="qtext">
      ${it.order.map((ci,k)=>`<button class="choice${sel===ci?" sel":""}" role="radio" aria-checked="${sel===ci}" data-choice="${ci}"><span class="letter">${LETTERS[k]}</span><span>${esc(choices[ci])}</span></button>`).join("")}
    </div>
    <div class="qnav">
      <button class="btn ghost" data-act="prev" ${r.pos===0?"disabled":""}>← Back</button>
      ${r.pos<r.items.length-1?`<button class="btn" data-act="next">Next →</button>`:`<button class="btn" data-act="submit">Finish &amp; see results</button>`}
    </div>
  </section>
  <section class="sheet">
    <div class="spread"><h3>All questions</h3><button class="btn small ghost" data-act="submit">Finish now</button></div>
    <div id="confirm"></div>
    <div class="map" style="margin-top:12px">${r.items.map((x,i)=>`<button data-go="${i}" class="${r.answers[i]!=null?"done":""} ${i===r.pos?"cur":""}" aria-label="Question ${i+1}${r.answers[i]!=null?", answered":""}">${i+1}</button>`).join("")}</div>
    <div class="row" style="margin-top:14px"><button class="btn small ghost" data-act="home">Save &amp; exit</button>${unanswered?`<span class="muted" style="font-size:15px">${unanswered} still blank</span>`:""}</div>
  </section>`;
}

function grade(r){
  return r.items.map((it,i)=>({i, it, c:CON[it.cid], q:CON[it.cid].qs[it.vi], chosen:r.answers[i], ok:r.answers[i]===0}));
}
function byTopic(g){
  const m = {};
  g.forEach(x=>{ const t=x.c.t; (m[t] ||= {right:0,total:0}); m[t].total++; if(x.ok) m[t].right++; });
  return QUIZ.topics.filter(t=>m[t.id]).map(t=>({t, ...m[t.id], p:pct(m[t.id].right,m[t.id].total)}));
}
function subsetPicker(topicStats){
  const stat = topicStats ? Object.fromEntries(topicStats.map(s=>[s.t.id,s])) : {};
  return `<div class="subset" id="subset">${QUIZ.topics.map(t=>{
    const s = stat[t.id], low = s && s.p<80, n = QUIZ.concepts.filter(c=>c.t===t.id).length;
    const checked = topicStats ? low : true;
    return `<label><input type="checkbox" name="topic" value="${t.id}" ${checked?"checked":""}> ${esc(t.name)} <span class="count">(${n})</span>${low?` <span class="low">${s.p}%</span>`:""}</label>`;}).join("")}</div>`;
}

function viewResults(){
  const r = S.round, g = grade(r), right = g.filter(x=>x.ok).length, wrong = g.length-right;
  const topics = byTopic(g);
  const shown = g.filter(x=> S.filter==="all" || (S.filter==="wrong" ? !x.ok : x.ok));
  const mastery = r.kind==="mastery";
  const defNext = wrong ? (mastery ? "mastery" : "missed") : "fresh";
  const barColor = p=> p>=80 ? "var(--ok)" : p>=60 ? "var(--warn)" : "var(--bad)";
  return `${header()}
  ${mastery ? (wrong
     ? `<div class="banner"><b>Mastery mode:</b> ${wrong} concept${wrong>1?"s":""} still to master. The next round asks them again with different wording.</div>`
     : `<div class="banner win"><b>Mastered!</b> Every concept in this mastery run has now been answered correctly.</div>`) : ""}
  <section class="sheet">
    <div class="eyebrow">Round ${r.num} · ${esc(r.label)}</div>
    <div class="score" style="margin-top:10px">
      <div class="big">${right}<small> / ${g.length}</small></div>
      <div><div style="font:700 24px/1 var(--display)">${pct(right,g.length)}%</div><div class="muted">${right} right · ${wrong} to fix</div></div>
      <div style="margin-left:auto"><a href="#next" class="btn small ghost" style="text-decoration:none;display:inline-block">Jump to next steps ↓</a></div>
    </div>
    ${topics.length>1?`<div class="topics">${topics.map(s=>`<div class="trow"><span>${esc(s.t.name)}</span><span class="bar"><i style="width:${s.p}%;background:${barColor(s.p)}"></i></span><span class="pct">${s.right}/${s.total}</span></div>`).join("")}</div>`:""}
  </section>

  <section class="sheet">
    <div class="spread"><h2>What was right and wrong</h2>
      <div class="tabs" role="tablist">
        <button data-filter="all" class="${S.filter==="all"?"on":""}">All (${g.length})</button>
        <button data-filter="wrong" class="${S.filter==="wrong"?"on":""}">Wrong (${wrong})</button>
        <button data-filter="right" class="${S.filter==="right"?"on":""}">Right (${right})</button>
      </div></div>
    <div class="review">${shown.length? shown.map(x=>{
      const choices=[x.q[1],...x.q[2]], t=TOP[x.c.t];
      return `<article class="ritem${x.ok?"":" wrong"}">
        <div class="row" style="gap:8px"><span class="${x.ok?"tag-ok":"tag-bad"}">${x.ok?"✓ Right":"✗ Wrong"}</span><span class="count">Q${x.i+1}</span><span class="term">${esc(termOf(x.c))}</span><a class="chip" href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)} ↗</a></div>
        <div class="rq">${esc(x.q[0])}</div>
        <div class="ans">${x.ok?`<div>Answer: <b>${esc(choices[0])}</b></div>`:
          `<div>Your answer: <span class="tag-bad">${x.chosen==null?"(left blank)":esc(choices[x.chosen])}</span></div><div>Correct answer: <b class="tag-ok">${esc(choices[0])}</b></div>`}</div>
        <div class="why">${esc(x.q[3])}</div></article>`;}).join("") : `<p class="muted">Nothing here.</p>`}</div>
  </section>

  <section class="sheet next" id="next">
    <h2 style="margin-bottom:14px">Next steps</h2>
    <form id="nextform" style="display:flex;flex-direction:column;gap:18px">
      <fieldset><legend>Also do</legend>
        <label class="opt${wrong?"":" dis"}"><input type="checkbox" id="o-print" ${wrong?"":"disabled"}><div><b>Print notebook sheet</b><span>Each missed question with the correct answer, a notebook note to copy, and the lesson to find it in.</span></div></label>
        <label class="opt"><input type="checkbox" id="o-shuffle" checked><div><b>Shuffle answer order</b><span>For repeated questions, so the right answer isn't in the same spot (stops "it was C" memorizing).</span></div></label>
      </fieldset>
      <fieldset><legend>Next round (pick one)</legend>
        ${radio("missed","Retake the questions I missed",`The same ${wrong} question${wrong===1?"":"s"}.`, !wrong, defNext)}
        ${radio("mastery","Keep going until mastered",`The ${wrong} missed concept${wrong===1?"":"s"} with new wording each round, repeating until every one is right.`, !wrong, defNext)}
        ${radio("same","Retake this same test",`All ${g.length} questions again, exactly as they were.`, false, defNext)}
        ${radio("fresh","New questions on every concept",`A fresh set of ${QUIZ.concepts.length} questions on all the same concepts.`, false, defNext)}
        ${radio("subset","New questions on lessons I choose","Lessons scored under 80% are pre-checked.", false, defNext)}
        <div id="subsetwrap" hidden>${subsetPicker(topics)}</div>
        ${radio("scratch","Start over from scratch","A brand-new full test with different wording that ignores past results. Clears the score history, as if he'd never taken it.", false, defNext)}
        ${radio("none","No new round right now","Go back to the start page.", false, defNext)}
      </fieldset>
      <div class="row"><button class="btn" type="submit" id="go">Start</button><button class="btn ghost" type="button" data-act="copy">Copy missed questions as text</button><span id="copymsg" class="muted" style="font-size:15px"></span></div>
    </form>
  </section>
  ${historyTable()}`;
}
function radio(v,title,sub,dis,def){
  return `<label class="opt${dis?" dis":""}"><input type="radio" name="next" value="${v}" ${dis?"disabled":""} ${v===def?"checked":""}><div><b>${title}</b><span>${sub}</span></div></label>`;
}

/* ---------- actions ---------- */
function answer(ci){ const r=S.round; r.answers[r.pos]=ci; save(); render(); }
function go(i){ const r=S.round; r.pos=Math.max(0,Math.min(r.items.length-1,i)); save(); render(); }
function trySubmit(force){
  const r=S.round, blank=r.items.length-Object.keys(r.answers).length;
  if(blank && !force){
    $("#confirm").innerHTML = `<div class="notice" style="margin-top:12px"><span>${blank} question${blank>1?"s are":" is"} still blank and will count as wrong.</span><button class="btn small" data-act="forcesubmit">Finish anyway</button><button class="btn small ghost" data-act="firstblank">Go to first blank</button></div>`;
    bind(); $("#confirm").scrollIntoView({block:"nearest"}); return;
  }
  r.submitted=true;
  const g=grade(r);
  S.history.push({num:r.num,label:r.label,right:g.filter(x=>x.ok).length,total:g.length,when:Date.now()});
  if(S.history.length>40) S.history=S.history.slice(-40);
  S.view="results"; save(); render(); window.scrollTo(0,0);
}

function printSheet(items, title){
  const today = new Date().toLocaleDateString([], {month:"long",day:"numeric",year:"numeric"});
  $("#print").innerHTML = `<div class="p-head"><h1>${esc(title)}</h1><div>${esc(QUIZ.title)} · ${today}</div></div>` +
    items.map((x,n)=>{ const t=TOP[x.c.t];
      return `<div class="p-item">
        <div class="pterm">${n+1}. ${esc(termOf(x.c))}</div>
        ${x.q?`<div class="pq">${esc(x.q[0])}</div>`:""}
        ${x.q?`<div><span class="p-lbl">Answer:</span> ${esc(x.q[1])}</div>`:""}
        <div><span class="p-lbl">Notebook:</span> ${esc(x.c.note)}</div>
        <div><span class="p-lbl">Find it in:</span> ${esc(t.name)}</div></div>`; }).join("");
  setTimeout(()=>window.print(), 50);
}
function missedText(){
  const g=grade(S.round).filter(x=>!x.ok);
  return g.map((x,n)=>`${n+1}. KEY TERM: ${termOf(x.c)}\n   ${x.q[0]}\n   Answer: ${x.q[1]}\n   Notebook: ${x.c.note}\n   Find it in: ${TOP[x.c.t].name}`).join("\n\n");
}

function doNext(e){
  e.preventDefault();
  const r=S.round, g=grade(r), missed=g.filter(x=>!x.ok);
  const doPrint=$("#o-print")?.checked, shuf=$("#o-shuffle").checked;
  const choice=(new FormData($("#nextform"))).get("next");
  if(doPrint && missed.length) printSheet(missed, `Notebook log · Round ${r.num} (${g.length-missed.length}/${g.length})`);
  const reorder = it => ({cid:it.cid, vi:it.vi, order: shuf ? shuffle([0,1,2,3]) : it.order.slice()});
  const after = ()=>{
    if(choice==="missed") newRound("missed", missed.map(x=>reorder(x.it)), "Missed questions");
    else if(choice==="mastery") newRound("mastery", missed.map(x=>makeItem(x.it.cid, variantFor(x.it.cid,true))), "Mastery round");
    else if(choice==="same") newRound(r.kind==="mastery"?"same":r.kind, r.items.map(reorder), r.label.replace(/ \(retake\)$/,"")+" (retake)");
    else if(choice==="fresh") startFull(true);
    else if(choice==="subset"){
      const ids=[...document.querySelectorAll('#subset input[name=topic]:checked')].map(i=>i.value);
      if(!ids.length){ $("#copymsg").textContent="Pick at least one lesson."; return; }
      startFull(true, QUIZ.concepts.filter(c=>ids.includes(c.t)).map(c=>c.id));
    } else if(choice==="scratch") startOver();
    else { S.view="home"; save(); render(); window.scrollTo(0,0); }
  };
  // let the print dialog open on the results page before switching views
  if(doPrint && missed.length) setTimeout(after, 400); else after();
}

function bind(){
  document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>answer(+b.dataset.choice));
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
  document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.filter;save();render();});
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=ev=>{
    const a=b.dataset.act;
    if(a==="start") startFull(S.history.length>0);
    if(a==="choose"){ $("#chooser").hidden=!$("#chooser").hidden; }
    if(a==="scratchask"){ $("#scratchconfirm").hidden=false; }
    if(a==="scratchno"){ $("#scratchconfirm").hidden=true; }
    if(a==="scratch") startOver();
    if(a==="startsubset"){
      const ids=[...document.querySelectorAll('#subset input[name=topic]:checked')].map(i=>i.value);
      if(ids.length) startFull(S.history.length>0, QUIZ.concepts.filter(c=>ids.includes(c.t)).map(c=>c.id));
    }
    if(a==="printall") printSheet(QUIZ.concepts.map(c=>({c})), "Study notes · every concept");
    if(a==="resume"){ S.view="quiz"; save(); render(); }
    if(a==="prev") go(S.round.pos-1);
    if(a==="next") go(S.round.pos+1);
    if(a==="submit") trySubmit(false);
    if(a==="forcesubmit") trySubmit(true);
    if(a==="firstblank"){ const r=S.round; const i=r.items.findIndex((x,k)=>r.answers[k]==null); go(i); }
    if(a==="home"){ S.view="home"; save(); render(); }
    if(a==="copy"){
      const txt=missedText()||"Nothing missed!";
      const done=m=>{$("#copymsg").textContent=m;};
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>done("Copied."),()=>done("Couldn't copy here."));
    }
  });
  const f=$("#nextform");
  if(f){
    f.onsubmit=doNext;
    const sync=()=>{
      const v=(new FormData(f)).get("next");
      $("#subsetwrap").hidden = v!=="subset";
      const p=$("#o-print")?.checked;
      const labels={missed:"Start missed questions",mastery:"Start mastery round",same:"Start retake",fresh:"Start new test",subset:"Start chosen lessons",scratch:"Start over",none:"Done"};
      $("#go").textContent = (p ? (v==="none"?"Print":"Print & ") : "") + (p&&v==="none" ? "" : (p?labels[v].toLowerCase():labels[v]));
    };
    f.onchange=sync; sync();
  }
}
document.addEventListener("keydown",e=>{
  if(S.view!=="quiz"||!S.round||S.round.submitted) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key.toUpperCase(), it=S.round.items[S.round.pos];
  const idx = "ABCD".indexOf(k)>=0 ? "ABCD".indexOf(k) : "1234".indexOf(k);
  if(idx>=0){ answer(it.order[idx]); }
  else if(e.key==="ArrowRight") go(S.round.pos+1);
  else if(e.key==="ArrowLeft") go(S.round.pos-1);
});
render();
})();
</script>
</body>
