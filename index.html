<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science Practice Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a lab-notebook page. One centered column, faint graph-paper ground, ink-blue accent. */
:root{
  --paper:#f7f8fb; --sheet:#ffffff; --grid:#e6eaf2; --ink:#1b2333; --muted:#5d6779;
  --line:#d5dbe6; --accent:#2747a0; --accent-soft:#e7ecfa; --artery:#b3263b;
  --ok:#17803d; --ok-soft:#e5f5eb; --bad:#c2410c; --bad-soft:#fdeee6; --warn:#a16207;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11151d; --sheet:#181d27; --grid:#1d2330; --ink:#e7ebf3; --muted:#9aa4b6;
    --line:#2c3443; --accent:#8fa8f0; --accent-soft:#222c46; --artery:#f07a8a;
    --ok:#4ccf7d; --ok-soft:#173224; --bad:#ff8a57; --bad-soft:#3a2117; --warn:#e2b04a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151d; --sheet:#181d27; --grid:#1d2330; --ink:#e7ebf3; --muted:#9aa4b6;
  --line:#2c3443; --accent:#8fa8f0; --accent-soft:#222c46; --artery:#f07a8a;
  --ok:#4ccf7d; --ok-soft:#173224; --bad:#ff8a57; --bad-soft:#3a2117; --warn:#e2b04a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font:17px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 64px;
}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
a{color:var(--accent)}
.eyebrow{font:700 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--artery)}
.muted{color:var(--muted)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:22px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
button{font:inherit;cursor:pointer}
.btn{border:1.5px solid var(--accent);background:var(--accent);color:var(--sheet);border-radius:8px;padding:10px 18px;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:6px 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lesson-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.lesson-list li{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.lesson-list a{text-decoration:none;font-weight:700}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap}

/* quiz */
.progress{height:8px;background:var(--grid);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qtopic{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;text-decoration:none}
.qtext{font:700 clamp(20px,3.2vw,24px)/1.35 var(--display);margin:14px 0 18px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink)}
.choice:hover{border-color:var(--accent)}
.choice .letter{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-weight:700;font-size:14px}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .letter{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.qnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.map button{padding:6px 0;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.map button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.map button.cur{outline:2px solid var(--artery);outline-offset:1px}
.notice{padding:12px 14px;border-radius:8px;background:var(--bad-soft);border:1px solid var(--bad);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
kbd{font:12px/1 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:var(--paper)}

/* results */
.score{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}
.big{font:800 56px/1 var(--display);font-variant-numeric:tabular-nums}
.big small{font-size:24px;color:var(--muted);font-weight:700}
.topics{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 120px 72px;gap:12px;align-items:center;font-size:15px}
.bar{height:10px;border-radius:99px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.pct{font-variant-numeric:tabular-nums;text-align:right}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:99px;padding:5px 14px;font-size:15px}
.tabs button.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.review{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.ritem{border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:8px;padding:12px 14px;background:var(--sheet)}
.ritem.wrong{border-left-color:var(--bad)}
.ritem .rq{font-weight:700;margin:4px 0 6px}
.ritem .ans{font-size:15px;display:flex;flex-direction:column;gap:2px}
.ritem .why{font-size:15px;color:var(--muted);margin-top:6px}
.term{font-weight:700;font-size:14px;padding:2px 8px;border-radius:4px;background:var(--grid);color:var(--ink)}
.tag-ok{color:var(--ok);font-weight:700}.tag-bad{color:var(--bad);font-weight:700}
.next fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.next legend{font:700 13px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--sheet)}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.opt b{display:block}
.opt span{font-size:15px;color:var(--muted)}
.opt.dis{opacity:.5;cursor:not-allowed}
.subset{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;margin:4px 0 0 30px}
.subset label{display:flex;gap:8px;align-items:center;font-size:15px}
.subset .low{color:var(--bad);font-weight:700;font-size:13px}
.hist{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.hist td,.hist th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.hist th{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.banner{padding:14px 16px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent)}
.banner.win{background:var(--ok-soft);border-color:var(--ok)}
.sr{position:absolute;left:-9999px}
#print{display:none}
@media (max-width:520px){.trow{grid-template-columns:minmax(0,1fr) 70px 64px}.sheet{padding:16px}.big{font-size:44px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* printing: only the notebook sheet */
@page{margin:0.6in}
@media print{
  body{background:#fff;color:#000;padding:0;font-size:12pt}
  #app{display:none!important}
  #print{display:block!important}
  .p-head{border-bottom:2px solid #000;padding-bottom:6pt;margin-bottom:10pt}
  .p-head h1{font-size:18pt}
  .p-item{break-inside:avoid;border-bottom:1px solid #999;padding:8pt 0}
  .p-item .pterm{font-weight:700;font-size:13pt}
  .p-item .pq{font-style:italic}
  .p-item div{margin-top:3pt}
  .p-lbl{font-weight:700;text-transform:uppercase;font-size:9pt;letter-spacing:.05em}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script>
const QUIZ = {"title": "Cells & the Cardiovascular System", "subtitle": "7th grade science · key terms (bold & highlighted words)", "topics": [{"id": "micro", "name": "Microscopes", "url": "https://flexbooks.ck12.org/cbook/ck-12-middle-school-life-science-2.0/section/1.6/primary/lesson/microscopes-ms-ls/"}, {"id": "cells", "name": "Cell Theory", "url": "https://flexbooks.ck12.org/cbook/ck-12-middle-school-life-science-2.0/section/2.3/primary/lesson/cell-biology-ms-ls/"}, {"id": "prok", "name": "Prokaryotic & Eukaryotic Cells", "url": "https://flexbooks.ck12.org/cbook/ck-12-middle-school-life-science-2.0/section/2.4/primary/lesson/prokaryotic-and-eukaryotic-cells-ms-ls/"}, {"id": "virus", "name": "Viruses", "url": "https://flexbooks.ck12.org/cbook/ck-12-middle-school-life-science-2.0/section/5.1/primary/lesson/viruses-ms-ls/"}, {"id": "body", "name": "Organization of the Human Body", "url": "https://flexbooks.ck12.org/cbook/ck-12-middle-school-life-science-2.0/section/11.1/primary/lesson/organization-of-the-human-body-ms-ls/"}, {"id": "cardio", "name": "Cardiovascular System", "url": "https://flexbooks.ck12.org/cbook/ck-12-middle-school-life-science-2.0/section/11.21/primary/lesson/cardiovascular-system-ms-ls/"}, {"id": "heart", "name": "The Heart", "url": "https://flexbooks.ck12.org/cbook/ck-12-middle-school-life-science-2.0/section/11.23/primary/lesson/heart-ms-ls/"}, {"id": "vessels", "name": "Blood Vessels", "url": "https://flexbooks.ck12.org/cbook/ck-12-middle-school-life-science-2.0/section/11.24/primary/lesson/blood-vessels-ms-ls/"}, {"id": "bp", "name": "Blood Pressure", "url": "https://flexbooks.ck12.org/cbook/ck-12-middle-school-life-science-2.0/section/11.25/primary/lesson/blood-pressure-ms-ls/"}], "concepts": [{"id": "k-mic", "t": "micro", "term": "Microscope / Microscopy", "note": "MICROSCOPE: a tool that makes things too small to be seen by the human eye look bigger. MICROSCOPY: the study of small objects using microscopes.", "qs": [["A tool used to make things that are too small to be seen by the human eye look bigger is called a…", "Microscope", ["Telescope", "Specimen", "Sphygmomanometer"], "A microscope is a tool used to make things too small to be seen by the human eye look bigger."], ["What is microscopy?", "The study of small objects using microscopes", ["A tool that makes small things look bigger", "The study of bacteria only", "The process of making glass lenses"], "Microscopy is the study of small objects using microscopes."], ["Which word means \"the study of small objects using microscopes\"?", "Microscopy", ["Magnification", "Cell theory", "Homeostasis"], "Microscopy is the study of small objects using microscopes."]]}, {"id": "k-mag", "t": "micro", "term": "Magnified", "note": "MAGNIFIED: made to look greatly enlarged. Zacharias Janssen and his son Hans (Dutch spectacle makers) found lenses in a tube made objects look magnified, which was the forerunner of the compound microscope and the telescope.", "qs": [["When the Janssens looked through lenses in a tube, nearby objects appeared greatly enlarged. What is the key word for \"greatly enlarged\"?", "Magnified", ["Specialized", "Replicated", "Contracted"], "Nearby objects appeared greatly enlarged, or magnified."], ["Who first discovered that lenses in a tube made nearby objects look magnified?", "Zacharias Janssen and his son Hans", ["Robert Hooke", "Antonie van Leeuwenhoek", "Rudolf Virchow"], "Two Dutch spectacle makers, Zacharias Janssen and his son Hans, experimented with lenses in a tube."], ["The Janssens' lenses-in-a-tube discovery was the forerunner of which two tools?", "The compound microscope and the telescope", ["The electron microscope and the acoustic microscope", "The stethoscope and the sphygmomanometer", "The magnifying glass and the camera"], "Their discovery was the forerunner of the compound microscope and of the telescope."]]}, {"id": "k-hooke", "t": "micro", "term": "Cells (Robert Hooke)", "note": "CELLS: Robert Hooke (English, 1665) looked at a piece of cork and named the tiny structures he saw \"cells,\" the smallest structural unit of living organisms. His discovery led to the CELL THEORY.", "qs": [["What did Robert Hooke name the tiny structures he saw inside cork?", "Cells", ["Organelles", "Bacteria", "Protists"], "Inside cork, Hooke discovered tiny structures, which he called cells."], ["Robert Hooke discovered cells in 1665 by looking at…", "A piece of cork", ["Scum from his own teeth", "An onion skin", "A drop of pond water"], "In 1665, Hooke used a microscope to zoom in on a piece of cork, which is made from tree bark."], ["Hooke's discovery of cells eventually led to which important theory?", "The cell theory", ["The theory of evolution", "The theory that viruses are alive", "The theory that the heart has four chambers"], "Hooke's finding eventually led to the theory that all living things are made of cells: the cell theory."]]}, {"id": "k-bact", "t": "micro", "term": "Bacteria (van Leeuwenhoek)", "note": "BACTERIA: the smallest living organisms on the planet. Discovered by Antonie van Leeuwenhoek (\"father of microscopy,\" a Dutch cloth merchant) in scum from his own teeth.", "qs": [["What did van Leeuwenhoek discover in scum from his own teeth?", "Bacteria", ["Viruses", "Cork cells", "Red blood cells"], "Van Leeuwenhoek took a sample of scum from his teeth and discovered bacteria."], ["According to the lesson, what are the smallest living organisms on the planet?", "Bacteria", ["Viruses", "Protists", "Cork cells"], "Bacteria are the smallest living organisms. Viruses are smaller but are not considered living."], ["Who is called the \"father of microscopy\" and discovered bacteria?", "Antonie van Leeuwenhoek", ["Robert Hooke", "Zacharias Janssen", "Rudolf Virchow"], "Antonie van Leeuwenhoek, a Dutch cloth merchant, made his own microscope and discovered bacteria."]]}, {"id": "k-prot", "t": "micro", "term": "Protists", "note": "PROTISTS: one-celled organisms discovered by van Leeuwenhoek (he also discovered sperm cells). Protists are eukaryotes.", "qs": [["Besides bacteria, van Leeuwenhoek used his microscope to discover one-celled ___ and sperm cells.", "Protists", ["Viruses", "Organelles", "Tissues"], "Using microscopes, van Leeuwenhoek also discovered one-celled protists and sperm cells."], ["Which scientist discovered one-celled protists?", "Antonie van Leeuwenhoek", ["Robert Hooke", "Rudolf Virchow", "Hans Janssen"], "Van Leeuwenhoek discovered bacteria, one-celled protists, and sperm cells."], ["Are protists prokaryotes or eukaryotes?", "Eukaryotes", ["Prokaryotes", "Neither, because they are viruses", "Both, depending on their size"], "The Prokaryotic & Eukaryotic Cells lesson lists animals, plants, fungi, and protists as eukaryotes."]]}, {"id": "k-light", "t": "micro", "term": "Light microscopes", "note": "LIGHT MICROSCOPES: use lenses (glass or plastic) to focus light; magnify up to 2,000 times; the type used in most schools and labs.", "qs": [["Which type of microscope is used in most schools and labs?", "Light microscopes", ["Transmission electron microscopes", "Scanning electron microscopes", "Scanning acoustic microscopes"], "Most of the microscopes used in schools and laboratories are light microscopes."], ["About how much bigger can the most powerful light microscopes make an image?", "Up to 2,000 times", ["Up to 20 times", "Up to 2 million times", "Up to 500,000 times"], "The most powerful light microscopes can make images up to 2,000 times larger."], ["How does a light microscope work?", "Lenses made of glass or plastic focus light", ["It slides a beam of electrons across a surface", "It scans the specimen with sound waves", "It shoots electrons through the specimen"], "Light microscopes use lenses, typically glass or plastic, to focus light into the eye, a camera, or another detector."]]}, {"id": "k-tem", "t": "micro", "term": "Transmission electron microscopes (TEM)", "note": "TEM (TRANSMISSION ELECTRON MICROSCOPE): focuses a beam of electrons THROUGH an object; up to 2 million times bigger with a very clear image.", "qs": [["Which microscope focuses a beam of electrons THROUGH an object?", "Transmission electron microscope (TEM)", ["Scanning electron microscope (SEM)", "Light microscope", "Scanning acoustic microscope"], "A TEM focuses a beam of electrons through an object."], ["What does TEM stand for?", "Transmission electron microscope", ["Thermal energy microscope", "Total enlargement microscope", "Tiny element magnifier"], "TEM stands for transmission electron microscope."], ["Which microscope can make an image up to two million times bigger?", "Transmission electron microscope (TEM)", ["Scanning electron microscope (SEM)", "Light microscope", "Scanning acoustic microscope"], "A TEM can magnify up to 2 million times. SEM reaches about 500,000 times and light microscopes about 2,000 times."]]}, {"id": "k-sem", "t": "micro", "term": "Scanning electron microscopes (SEM)", "note": "SEM (SCANNING ELECTRON MICROSCOPE): slides a beam of electrons ACROSS the surface to show the shape and surface texture of tiny objects (a paperclip, a bedbug, even an atom); about 10 to 500,000 times.", "qs": [["Which microscope would you use to see the surface shape and texture of a bedbug?", "Scanning electron microscope (SEM)", ["Transmission electron microscope (TEM)", "Light microscope", "Scanning acoustic microscope"], "SEMs show the shape and surface texture of extremely small objects such as a paperclip, a bedbug, or even an atom."], ["How does a scanning electron microscope make an image?", "It slides a beam of electrons across the surface of the specimen", ["It passes light through glass lenses", "It sends electrons through the inside of the specimen", "It bounces sound waves off the specimen"], "An SEM slides a beam of electrons across the surface, making a detailed map of it."], ["What is the magnification range of a scanning electron microscope?", "About 10 to 500,000 times", ["Up to 2,000 times", "Up to 2 million times", "About 1 to 100 times"], "SEM magnification can be controlled from about 10 to 500,000 times."]]}, {"id": "k-acou", "t": "micro", "term": "Scanning acoustic microscopes", "note": "SCANNING ACOUSTIC MICROSCOPES: use SOUND WAVES to scan a specimen; useful in biology and medical research. The 4 types: light, TEM, SEM, scanning acoustic.", "qs": [["Which microscope uses sound waves to scan a specimen?", "Scanning acoustic microscope", ["Scanning electron microscope", "Transmission electron microscope", "Light microscope"], "Scanning acoustic microscopes use sound waves. (Acoustic means sound.)"], ["A scanning acoustic microscope scans a specimen using…", "Sound waves", ["Light", "Electrons", "Magnets"], "Scanning acoustic microscopes use sound waves and are useful in biology and medical research."], ["Which list names the four types of microscopes researchers use?", "Light, TEM, SEM, scanning acoustic", ["Light, X-ray, laser, TEM", "Compound, telescope, SEM, sonar", "Light, magnifying glass, hand lens, TEM"], "Researchers now use light microscopes, TEMs, SEMs, and scanning acoustic microscopes."]]}, {"id": "k-cell", "t": "cells", "term": "Cell", "note": "CELL: the smallest structural and functional unit of an organism. Bacteria = 1 cell; humans = trillions. Human and banana cells are actually very similar.", "qs": [["What is a cell?", "The smallest structural and functional unit of an organism", ["A group of tissues that work together", "Two or more organs working together", "A non-living particle made of DNA and protein"], "A cell is the smallest structural and functional unit of an organism."], ["Which term means \"the smallest structural and functional unit of an organism\"?", "Cell", ["Tissue", "Organ", "Organelle"], "The cell is the smallest structural and functional unit."], ["About how many cells make up a human body?", "Trillions", ["About one hundred", "A few thousand", "Just one"], "Big organisms like humans consist of trillions of cells. Some organisms, like bacteria, have only one."]]}, {"id": "k-em", "t": "cells", "term": "Electron microscope", "note": "ELECTRON MICROSCOPE (developed in the 1950s): passes a beam of ELECTRONS through the specimen, so we can see the smallest parts INSIDE cells. A LIGHT MICROSCOPE sends a beam of light.", "qs": [["What type of microscope is best for studying the structures inside cells?", "Electron microscope", ["Light microscope", "Magnifying glass", "Telescope"], "Many structures inside cells are too small for a light microscope; an electron microscope shows them."], ["A light microscope sends ___ through a specimen. An electron microscope sends ___.", "A beam of light; a beam of electrons", ["Sound waves; a beam of light", "A beam of electrons; a beam of light", "Heat; sound waves"], "A light microscope uses light and an electron microscope uses electrons."], ["When did scientists develop electron microscopes?", "The 1950s", ["1595", "1665", "1858"], "In the 1950s, scientists developed more powerful microscopes called electron microscopes."]]}, {"id": "k-hyp", "t": "cells", "term": "Hypothesis (Virchow)", "note": "HYPOTHESIS: Rudolf Virchow (1858) hypothesized that cells only come from other cells. Example: bacteria grow, then divide in half. Hundreds or thousands of experiments support cell theory, and no evidence contradicts it.", "qs": [["In 1858, Rudolf Virchow developed the ___ that cells only come from other cells.", "Hypothesis", ["Experiment", "Organ system", "Microscope"], "Virchow developed the hypothesis that cells only come from other cells."], ["Who hypothesized that cells only come from other cells?", "Rudolf Virchow", ["Robert Hooke", "Antonie van Leeuwenhoek", "Zacharias Janssen"], "In 1858 Rudolf Virchow developed this hypothesis."], ["Why is cell theory such a strong scientific theory?", "Many experiments support it and no evidence has ever contradicted it", ["Virchow was the most famous scientist", "It was the very first idea about cells", "Hooke proved it in one experiment in 1665"], "Many hundreds, if not thousands, of experiments support it, and no evidence contradicts it."]]}, {"id": "k-ct", "t": "cells", "term": "Cell theory", "note": "CELL THEORY: (1) All organisms are composed of cells. (2) Cells are alive and are the basic living units of organization. (3) All cells come from other cells.", "qs": [["Which statement is NOT part of the cell theory?", "Cells can form from nonliving material", ["All organisms are composed of cells", "Cells are the basic living units of organization", "All cells come from other cells"], "Cell theory says all cells come from other cells."], ["Which statement IS part of the cell theory?", "All organisms are composed of cells", ["All cells have a nucleus", "All cells are the same shape", "Viruses are the smallest cells"], "The first part of cell theory: all organisms are composed of cells."], ["According to the cell theory, could you make a cell by mixing molecules in a lab?", "No, because all cells come from other cells", ["Yes, if you use the right molecules", "Yes, but only bacteria cells", "No, because cells are not alive"], "Cell theory says all cells come from cells that existed before."]]}, {"id": "k-spec", "t": "cells", "term": "Specialized cells", "note": "SPECIALIZED CELLS: a cell's shape fits its job. RED BLOOD CELLS = flat discs (move through blood vessels, deliver oxygen). NERVE cells = long and stringy (communication, send signals). Skin cells = flat and tight (protect).", "qs": [["Why are red blood cells shaped like flat discs?", "To move easily through blood vessels and deliver oxygen", ["To send signals to the brain", "To fit tightly together and protect the body", "To store the body's DNA"], "Red blood cells are flat discs so they move easily and quickly through blood vessels."], ["Why are nerve cells long and stringy?", "To form a line of communication and send signals quickly", ["To carry oxygen through the blood", "To fit tightly together like tiles", "To make proteins"], "Nerve cells work like a wire, quickly sending signals like touching a hot stove to your brain."], ["A cell that has a special shape for a special job is called a…", "Specialized cell", ["Prokaryotic cell", "Host cell", "Cork cell"], "Each cell in your body is designed for a specific task; these are specialized cells."]]}, {"id": "k-multi", "t": "cells", "term": "Multicellular", "note": "MULTICELLULAR: made of many cells (for example, humans). Multicellular organisms have many types of specialized cells. All multicellular organisms are eukaryotes.", "qs": [["What does multicellular mean?", "Made of many cells", ["Made of one cell", "Made of no cells", "Made of only nerve cells"], "Multicellular means many-celled."], ["Which of these is a multicellular organism?", "A human", ["A bacterium", "A one-celled protist", "An archaean"], "Humans are made of trillions of cells. Bacteria, archaea, and one-celled protists are single-celled."], ["Multicellular organisms have many types of ___ cells in their bodies.", "Specialized", ["Prokaryotic", "Identical", "Viral"], "Multicellular organisms have many types of specialized cells."]]}, {"id": "k-levels", "t": "cells", "term": "Tissues, organs & organ systems", "note": "LEVELS: cell → tissue → organ → organ system → organism. Liver cells → liver tissue → liver (an organ). Brain + spinal cord + nerves = the nervous system (an organ system).", "qs": [["Which list goes from smallest to largest?", "Cell → tissue → organ → organ system → organism", ["Tissue → cell → organ → organism → organ system", "Cell → organ → tissue → organ system → organism", "Organ → tissue → cell → organ system → organism"], "Cells form tissues, tissues form organs, organs form organ systems, and organ systems form the organism."], ["Liver cells form liver tissue. Liver tissue forms…", "The liver, an organ", ["An organelle", "A single cell", "The nervous system"], "Your liver tissue is further organized into an organ, your liver."], ["Your brain, spinal cord, and nerves work together to form the…", "Nervous system, an organ system", ["Nervous tissue only", "Digestive system", "Circulatory organ"], "Your brain works with your spinal cord and other nerves to form the nervous system."]]}, {"id": "k-prok", "t": "prok", "term": "Prokaryotic cells / Prokaryotes", "note": "PROKARYOTIC CELLS: NO nucleus and no membrane-bound organelles; smaller and simpler; DNA is one large coiled circle. PROKARYOTES = organisms with prokaryotic cells: ONLY Bacteria and Archaea, all single-celled.", "qs": [["What is a prokaryotic cell?", "A cell with no nucleus, whose DNA is in the main part of the cell", ["A cell with a nucleus and membrane-bound organelles", "The protein coat around a virus", "A cell found only in animals"], "Prokaryotic cells do not have a nucleus. Their DNA floats around inside the cell."], ["Organisms made of prokaryotic cells are called…", "Prokaryotes", ["Eukaryotes", "Protists", "Organelles"], "Organisms with prokaryotic cells are called prokaryotes."], ["Which organisms are the only prokaryotes?", "Bacteria and Archaea", ["Plants and animals", "Fungi and protists", "Viruses and bacteria"], "Bacteria and Archaea are the only prokaryotes, and they are all single-celled."]]}, {"id": "k-euk", "t": "prok", "term": "Eukaryotic cells / Eukaryotes", "note": "EUKARYOTIC CELLS: HAVE a nucleus and membrane-bound organelles. EUKARYOTES = organisms with eukaryotic cells: animals, plants, fungi, protists. All multicellular organisms are eukaryotes (some eukaryotes are single-celled).", "qs": [["What is a eukaryotic cell?", "A cell with a nucleus and membrane-bound organelles", ["A cell with no nucleus", "A single circle of DNA", "A cell that only bacteria have"], "Eukaryotic cells have a nucleus and other membrane-bound organelles."], ["Which organisms are eukaryotes?", "Animals, plants, fungi, and protists", ["Bacteria and Archaea", "Only viruses", "Only single-celled organisms"], "Animals, plants, fungi, and protists are eukaryotes."], ["Which prokaryotes are multicellular?", "None; all multicellular organisms are eukaryotes", ["Archaea", "Bacteria", "Some protists"], "All prokaryotes are single-celled. All multicellular organisms are eukaryotes."]]}, {"id": "k-nuc", "t": "prok", "term": "Nucleus", "note": "NUCLEUS: the membrane-surrounded part of a eukaryotic cell where the DNA is stored. Main difference: eukaryotic cells have a nucleus, prokaryotic cells don't.", "qs": [["What is the main difference between eukaryotic and prokaryotic cells?", "Eukaryotic cells have a nucleus; prokaryotic cells do not", ["Prokaryotic cells have a nucleus; eukaryotic cells do not", "Only eukaryotic cells have DNA", "Only prokaryotic cells have a cell membrane"], "The main difference is that eukaryotic cells have a nucleus."], ["The nucleus is where a cell stores its…", "DNA", ["Proteins", "ATP", "Cytoplasm"], "The nucleus is where cells store their DNA, the genetic material."], ["What surrounds the nucleus?", "A membrane", ["A protein coat", "Ribosomes", "Nothing; it is open to the cytoplasm"], "The nucleus is surrounded by a membrane."]]}, {"id": "k-dna", "t": "prok", "term": "DNA / Genetic material", "note": "DNA: the GENETIC MATERIAL. In eukaryotic cells it's stored in the nucleus; in prokaryotic cells it forms one large circle that coils up on itself in the main part of the cell.", "qs": [["DNA is the cell's…", "Genetic material", ["Energy source", "Outer covering", "Protein factory"], "The nucleus is where cells store their DNA, which is the genetic material."], ["Where is the DNA in a prokaryotic cell?", "In the main part of the cell, not in a nucleus", ["Inside a nucleus", "Inside the mitochondria", "Outside the cell membrane"], "Prokaryotic cells have no nucleus, so their DNA is in the main part of the cell."], ["In a prokaryotic cell, the DNA forms…", "A single large circle that coils up on itself", ["Many chromosomes inside a nucleus", "A protein coat around the cell", "Tiny pieces stored in the ribosomes"], "Prokaryotic DNA forms a single large circle that coils up on itself."]]}, {"id": "k-pm", "t": "prok", "term": "Plasma membrane", "note": "PLASMA MEMBRANE (also called the CELL MEMBRANE): the PHOSPHOLIPID layer that surrounds the cell and protects it from the outside environment. All cells have one.", "qs": [["What does the plasma membrane do?", "Surrounds the cell and protects it from the outside environment", ["Makes proteins for the cell", "Stores the cell's DNA", "Makes energy for the cell"], "The plasma membrane surrounds the cell and protects it from the outside environment."], ["The plasma membrane is also called the…", "Cell membrane", ["Cytoplasm", "Nucleus", "Protein coat"], "The plasma membrane, or cell membrane, surrounds the cell."], ["The plasma membrane is a ___ layer.", "Phospholipid", ["Protein", "DNA", "Ribosome"], "The plasma membrane is the phospholipid layer that surrounds the cell."]]}, {"id": "k-ribo", "t": "prok", "term": "Ribosomes / Protein synthesis", "note": "RIBOSOMES: organelles WITHOUT a membrane where proteins are made. PROTEIN SYNTHESIS: the process of making proteins. All cells have ribosomes.", "qs": [["What are ribosomes?", "Organelles without a membrane where proteins are made", ["Membrane bags that store DNA", "The layer that surrounds the cell", "The liquid inside the nucleus"], "Ribosomes are the non-membrane bound organelles where proteins are made."], ["What is protein synthesis?", "The process of making proteins", ["The process of copying a virus", "The process of making ATP from oxygen", "Storing DNA in the nucleus"], "Proteins are made at the ribosomes, a process called protein synthesis."], ["Where in the cell does protein synthesis happen?", "At the ribosomes", ["In the nucleus", "In the plasma membrane", "In the Golgi apparatus"], "Ribosomes are where proteins are made."]]}, {"id": "k-cyto", "t": "prok", "term": "Cytoplasm", "note": "CYTOPLASM: all the contents of the cell inside the cell membrane, NOT including the nucleus. ALL cells have a plasma membrane, ribosomes, cytoplasm, and DNA.", "qs": [["What is the cytoplasm?", "All the contents inside the cell membrane, not including the nucleus", ["The layer that surrounds and protects the cell", "The place where DNA is stored", "A membrane-bound organelle"], "The cytoplasm is all the contents of the cell inside the cell membrane, not including the nucleus."], ["Which term means \"all the contents of the cell inside the cell membrane, not including the nucleus\"?", "Cytoplasm", ["Organelle", "Ribosome", "Chromosome"], "That is the definition of cytoplasm."], ["Which four things do ALL cells have?", "Plasma membrane, ribosomes, cytoplasm, and DNA", ["Nucleus, mitochondria, ribosomes, and DNA", "Nucleus, cytoplasm, Golgi apparatus, and DNA", "Plasma membrane, nucleus, mitochondria, and DNA"], "Both prokaryotic and eukaryotic cells have a plasma membrane, ribosomes, cytoplasm, and DNA."]]}, {"id": "k-chrom", "t": "prok", "term": "Chromosomes", "note": "CHROMOSOMES: made of DNA and protein. Eukaryotic cells usually have several (some species have close to 100 or more), protected inside the nucleus.", "qs": [["Eukaryotic cells usually have multiple ___, made of DNA and protein.", "Chromosomes", ["Ribosomes", "Mitochondria", "Nuclei"], "Eukaryotic cells usually have multiple chromosomes, composed of DNA and protein."], ["Chromosomes are made of…", "DNA and protein", ["Phospholipids", "ATP and enzymes", "Cytoplasm"], "Chromosomes are composed of DNA and protein."], ["Where are a eukaryotic cell's chromosomes protected?", "Inside the nucleus", ["Floating in the cytoplasm", "Inside the ribosomes", "Outside the cell membrane"], "These chromosomes are protected within the nucleus."]]}, {"id": "k-org", "t": "prok", "term": "Organelles", "note": "ORGANELLES: membrane-bound structures inside eukaryotic cells. They let eukaryotic cells be more specialized than prokaryotic cells. Examples: MITOCHONDRIA, ENDOPLASMIC RETICULUM, GOLGI APPARATUS.", "qs": [["What are organelles?", "Membrane-bound structures inside eukaryotic cells", ["Tiny prokaryotes living inside cells", "Groups of tissues", "Another name for chromosomes"], "In addition to a nucleus, eukaryotic cells include other membrane-bound structures called organelles."], ["Which list names organelles of eukaryotic cells from the lesson?", "Mitochondria, endoplasmic reticulum, Golgi apparatus", ["Atria, ventricles, valves", "Tissues, organs, organ systems", "Bacteria, Archaea, Eukarya"], "The lesson pictures the mitochondria, endoplasmic reticulum, and Golgi apparatus."], ["Would you find mitochondria or a Golgi apparatus in a bacterium?", "No, because bacteria are prokaryotes with no membrane-bound organelles", ["Yes, because all cells have them", "Yes, but only in very large bacteria", "No, because bacteria have no DNA"], "Prokaryotic cells do not have a nucleus or other membrane-bound organelles."]]}, {"id": "k-virus", "t": "virus", "term": "Virus", "note": "VIRUS: DNA or RNA surrounded by a coat of protein. Not made of a cell. Viruses cause the common cold and flu, and need a very powerful microscope to see.", "qs": [["What is a virus made of?", "DNA or RNA surrounded by a coat of protein", ["One cell with a nucleus", "A cell membrane filled with cytoplasm", "Ribosomes and mitochondria"], "A virus is essentially DNA or RNA surrounded by a coat of protein."], ["What surrounds the DNA or RNA of a virus?", "A coat of protein", ["A cell wall", "A plasma membrane", "A nucleus"], "A virus's genetic material is surrounded by a protein coat."], ["Why are viruses NOT considered living?", "They are not made of cells and cannot reproduce on their own", ["They have no genetic material", "They can never change", "They are too large to be cells"], "Viruses are not made of a cell and need to infect a host cell to reproduce."]]}, {"id": "k-dom", "t": "virus", "term": "Domain", "note": "DOMAIN: the three domains of life are BACTERIA, ARCHAEA, and EUKARYA. Viruses don't belong to any of them.", "qs": [["What are the three domains of life?", "Bacteria, Archaea, Eukarya", ["Plants, animals, fungi", "Prokaryotes, eukaryotes, viruses", "Cells, tissues, organs"], "The lesson asks: which domain do viruses belong to? Bacteria? Archaea? Eukarya?"], ["Which domain do viruses belong to?", "None of the three domains", ["Bacteria", "Archaea", "Eukarya"], "A virus is very different from any of the organisms in the three domains of life."], ["Humans have eukaryotic cells. Which domain do humans belong to?", "Eukarya", ["Bacteria", "Archaea", "None of the domains"], "Organisms with eukaryotic cells (with a nucleus) belong to Eukarya."]]}, {"id": "k-homeo", "t": "virus", "term": "Homeostasis", "note": "HOMEOSTASIS: maintaining a stable internal environment. Viruses can't maintain homeostasis, one reason they are not considered alive.", "qs": [["What is homeostasis?", "Maintaining a stable internal environment", ["Making copies of yourself", "Changing genetic material over time", "Breaking down food for energy"], "A stable internal environment is called homeostasis."], ["Which term means \"maintaining a stable internal environment\"?", "Homeostasis", ["Replication", "Evolution", "Protein synthesis"], "That is the definition of homeostasis."], ["A virus cannot maintain homeostasis. This is one reason viruses are…", "Not considered living", ["Considered bacteria", "Called eukaryotes", "Able to reproduce on their own"], "A virus is not made of a cell and cannot maintain homeostasis, so it is not considered living."]]}, {"id": "k-host", "t": "virus", "term": "Host cell", "note": "HOST CELL: the cell a virus infects. The virus injects its genetic material, and the host cell makes copies of the viral DNA and viral proteins, which are packaged into new viruses. Hosts can be plants, animals, or bacteria.", "qs": [["Viruses cannot reproduce on their own. They need to infect a ___ to reproduce.", "Host cell", ["Nucleus", "Domain", "Protein coat"], "Viruses need to infect a host cell to reproduce."], ["Which organisms can be hosts for viruses?", "Plants, animals, and bacteria", ["Only humans", "Only animals", "Only bacteria"], "Viruses infect a variety of organisms, including plants, animals, and bacteria."], ["After a virus injects its genetic material, what does the host cell do?", "Makes copies of the viral DNA and viral proteins, which become new viruses", ["Destroys the virus right away", "Turns into a virus itself", "Divides in half to escape"], "The host cell makes a copy of the viral DNA and produces viral proteins, which are packaged into new viruses."]]}, {"id": "k-gen", "t": "virus", "term": "Genetic material", "note": "GENETIC MATERIAL: viruses have genetic material (DNA or RNA) like all cells do, even though they aren't cells. It can change (mutate), which alters the virus's traits.", "qs": [["Viruses have ___ like all cells do, even though they are not made of cells.", "Genetic material", ["Ribosomes", "A nucleus", "Cytoplasm"], "They have genetic material like all cells do."], ["A virus's genetic material is…", "DNA or RNA", ["Protein only", "ATP", "Phospholipids"], "A virus is DNA or RNA surrounded by a protein coat."], ["When a virus's genetic material changes (mutates), what can happen?", "The virus's traits can change", ["The virus becomes a cell", "The virus becomes a bacterium", "The virus loses its protein coat forever"], "The genetic material of a virus can change (mutate), altering the traits of the virus."]]}, {"id": "k-evo", "t": "virus", "term": "Evolution", "note": "EVOLUTION: the process that has resulted in all life on the planet today. Viruses can evolve, so their classification is controversial and calls into question the definition of life.", "qs": [["Viruses share two traits with living things: they have genetic material and they can…", "Evolve", ["Maintain homeostasis", "Reproduce on their own", "Make their own ATP"], "Viruses have genetic material and they can evolve."], ["What is the process that has resulted in all life on the planet today?", "Evolution", ["Replication", "Homeostasis", "Protein synthesis"], "The process of evolution has resulted in all life on the planet today."], ["Why has the classification of viruses been controversial?", "They have genetic material and evolve like life, but are not made of cells", ["They are bigger than bacteria", "They only infect plants", "They have a nucleus but no DNA"], "Because viruses can evolve but aren't cells, they call into question the very definition of life."]]}, {"id": "k-atp", "t": "virus", "term": "ATP", "note": "ATP: the cell's ENERGY. Viruses use the host cell's ATP to make copies of themselves. Cells make ATP using oxygen in cellular respiration.", "qs": [["ATP is the cell's…", "Energy", ["Genetic material", "Protein coat", "Waste product"], "The lesson describes ATP as the cell's energy."], ["Inside a host cell, a virus uses the cell's ATP, ribosomes, and enzymes to…", "Make copies of itself", ["Build a nucleus", "Become a living cell", "Protect the host cell"], "They use the cell's own ATP, ribosomes, enzymes, and other parts to make copies of themselves."], ["Cells use oxygen in cellular respiration to make energy in the form of…", "ATP", ["DNA", "Carbon dioxide", "Enzymes"], "Oxygen is used in cellular respiration to produce energy in the form of ATP."]]}, {"id": "k-enz", "t": "virus", "term": "Enzymes & ribosomes (borrowed by viruses)", "note": "ENZYMES and RIBOSOMES: cell parts a virus borrows from its host cell (along with ATP) to make copies of itself. A virus doesn't have its own.", "qs": [["Which host cell parts does a virus use to copy itself?", "ATP, ribosomes, and enzymes", ["Only its own ribosomes", "Its own nucleus", "No cell parts at all"], "Inside the host cell, viruses use the cell's own ATP, ribosomes, enzymes, and other parts."], ["Why does a virus need to borrow the host cell's ribosomes and enzymes?", "A virus has no cell parts of its own to make copies", ["Ribosomes give the virus its protein coat permanently", "Enzymes turn the virus into a living cell", "The host cell asks the virus to use them"], "Viruses are not made of cells, so they rely on the host cell's parts."], ["Enzymes and ribosomes, in the Viruses lesson, are…", "Cell parts that viruses use from their host cell", ["Parts that every virus brings with it", "Types of viruses", "Diseases caused by viruses"], "Viruses use the host cell's ATP, ribosomes, and enzymes."]]}, {"id": "k-rep", "t": "virus", "term": "Replicate", "note": "REPLICATE: to make copies of itself (reproduce). Viruses cannot replicate on their own; they rely on a host cell to make more viruses.", "qs": [["What does replicate mean?", "To make copies of itself", ["To keep a stable internal environment", "To change over many generations", "To break down food"], "Viruses cannot replicate, or reproduce, on their own."], ["Can viruses replicate on their own?", "No, they rely on a host cell to make more viruses", ["Yes, by dividing in half", "Yes, by making their own ATP", "Only inside a nucleus they build themselves"], "So viruses cannot replicate on their own; they rely on a host cell."], ["Which word means the same as \"reproduce\" in the Viruses lesson?", "Replicate", ["Mutate", "Infect", "Evolve"], "The lesson says viruses cannot replicate or reproduce on their own."]]}, {"id": "k-aids", "t": "virus", "term": "AIDS & viral diseases", "note": "Viral diseases: the flu, the common cold, rabies, diarrheal diseases, AIDS, cold sores (a herpes virus). They range from mild to fatal.", "qs": [["Which of these is caused by a virus?", "AIDS", ["Hypertension", "A broken bone", "A sunburn"], "Viruses cause the flu, the common cold, rabies, diarrheal diseases, AIDS, cold sores, and more."], ["What causes cold sores?", "A herpes virus", ["Bacteria", "High blood pressure", "Too much sunlight"], "Cold sores are caused by a herpes virus."], ["Which list has ONLY diseases caused by viruses?", "Flu, rabies, AIDS, cold sores", ["Flu, hypertension, rabies, AIDS", "Common cold, stroke, AIDS, flu", "Rabies, dehydration, flu, cold sores"], "Hypertension, stroke, and dehydration are not caused by viruses."]]}, {"id": "k-tis", "t": "body", "term": "Tissue", "note": "TISSUE: a group of similar cells that work together. The body has 4 main types: epithelial, connective, muscle, and nervous.", "qs": [["A group of cells that work together form a(n)…", "Tissue", ["Organ", "Organ system", "Organelle"], "A group of cells that work together form a tissue."], ["How many main types of tissue does your body have?", "Four", ["Two", "Twelve", "One hundred"], "Your body has four main types of tissue."], ["Which list names the four main types of tissue?", "Epithelial, connective, muscle, nervous", ["Skin, blood, bone, brain", "Cardiac, smooth, skeletal, nervous", "Epithelial, cardiac, lymph, bone"], "The four tissue types are epithelial, connective, muscle, and nervous."]]}, {"id": "k-epi", "t": "body", "term": "Epithelial tissue", "note": "EPITHELIAL TISSUE: layers of tightly packed cells that line the surfaces of the body. Examples: skin, the lining of the mouth and nose, the lining of the digestive system.", "qs": [["Which tissue is made of tightly packed layers of cells that line the surfaces of the body?", "Epithelial tissue", ["Connective tissue", "Muscle tissue", "Nervous tissue"], "Epithelial tissue lines the surfaces of the body."], ["Which is an example of epithelial tissue?", "The lining of the mouth", ["Bone", "Tendon", "The spinal cord"], "Examples include the skin, the lining of the mouth and nose, and the lining of the digestive system."], ["Skin is an example of which type of tissue?", "Epithelial tissue", ["Connective tissue", "Muscle tissue", "Nervous tissue"], "Skin is epithelial tissue."]]}, {"id": "k-con", "t": "body", "term": "Connective tissue", "note": "CONNECTIVE TISSUE: many types of cells that SUPPORT and BIND other tissues. Examples: TENDON, CARTILAGE, BONE. BLOOD is a specialized connective tissue.", "qs": [["What is the job of connective tissue?", "To support and bind other tissues of the body", ["To contract and allow movement", "To sense stimuli and send signals", "To line the surfaces of the body"], "Connective tissue cells support and bind other tissues."], ["Which are examples of connective tissue?", "Tendon, cartilage, and bone", ["Skin and the lining of the mouth", "The brain and nerves", "Cardiac and skeletal muscle"], "Examples of connective tissue include tendon, cartilage, and bone."], ["Blood is classified as a specialized ___ tissue.", "Connective", ["Epithelial", "Muscle", "Nervous"], "Blood is also classified as a specialized connective tissue."]]}, {"id": "k-mus", "t": "body", "term": "Muscle tissue", "note": "MUSCLE TISSUE: bands of cells that CONTRACT and allow movement. Types of muscle include cardiac (heart), skeletal, and smooth muscle.", "qs": [["Which tissue is made of bands of cells that contract and allow movement?", "Muscle tissue", ["Nervous tissue", "Epithelial tissue", "Connective tissue"], "Muscle tissue is made up of bands of cells that contract and allow movement."], ["What does muscle tissue do?", "Contracts and allows movement", ["Supports and binds other tissues", "Lines the surfaces of the body", "Senses stimuli and sends signals"], "Muscle cells contract to allow movement."], ["Which three kinds of muscle are listed in the muscular system?", "Cardiac, skeletal, and smooth muscle", ["Epithelial, connective, and nervous", "Tendon, cartilage, and bone", "Atria, ventricles, and valves"], "The muscular system includes cardiac (heart) muscle, skeletal muscle, smooth muscle, and tendons."]]}, {"id": "k-nerv", "t": "body", "term": "Nervous tissue / Stimuli", "note": "NERVOUS TISSUE: nerve cells that sense STIMULI and transmit signals. Found in nerves, the spinal cord, and the brain.", "qs": [["Nervous tissue is made of nerve cells that sense ___ and transmit signals.", "Stimuli", ["Hormones", "Nutrients", "Gametes"], "Nervous tissue is made up of nerve cells that sense stimuli and transmit signals."], ["Where is nervous tissue found?", "In nerves, the spinal cord, and the brain", ["In bones and tendons", "Only in the skin", "In the lining of the stomach"], "Nervous tissue is found in nerves, the spinal cord, and the brain."], ["Which tissue senses stimuli and transmits signals?", "Nervous tissue", ["Muscle tissue", "Connective tissue", "Epithelial tissue"], "That is the job of nervous tissue."]]}, {"id": "k-organ", "t": "body", "term": "Organ", "note": "ORGAN: a structure made of two or more tissues that work together. The heart is made of all four tissue types.", "qs": [["What is an organ?", "A structure made of two or more tissues that work together", ["A group of identical cells", "A single large cell", "A group of organ systems"], "An organ is a structure made of two or more tissues that work together."], ["How many of the four tissue types are found in the heart?", "All four", ["Only one", "Two", "Three"], "The heart is made up of the four types of tissues."], ["Which of these is an organ?", "The heart", ["Blood", "A nerve cell", "Epithelial tissue"], "The heart is an organ; blood is a tissue and a nerve cell is a cell."]]}, {"id": "k-osys", "t": "body", "term": "Organ system", "note": "ORGAN SYSTEM: organs that work together. The heart, blood, and blood vessels form the CARDIOVASCULAR SYSTEM. The body has 12 organ systems, and they must all work together.", "qs": [["Organs that work together form a(n)…", "Organ system", ["Tissue", "Organelle", "Organism"], "Organs that work together form an organ system."], ["Your heart, blood, and blood vessels together form your…", "Cardiovascular system", ["Respiratory system", "Nervous system", "Lymphatic system"], "Together, your heart, blood, and blood vessels form your cardiovascular system."], ["How many organ systems does the human body have, according to the lesson?", "12", ["4", "8", "20"], "Your body's 12 organ systems are shown in the lesson's table."]]}, {"id": "k-horm", "t": "body", "term": "Hormones (endocrine system)", "note": "HORMONES: chemicals that communicate between cells. Made by the ENDOCRINE SYSTEM: PITUITARY GLAND, HYPOTHALAMUS, ADRENAL GLANDS, ovaries, testes.", "qs": [["The endocrine system produces ___ that communicate between cells.", "Hormones", ["Gametes", "Nutrients", "Stimuli"], "The endocrine system produces hormones that communicate between cells."], ["Which organs belong to the endocrine system?", "Pituitary gland, hypothalamus, adrenal glands", ["Lymph nodes and lymph vessels", "Trachea, larynx, pharynx", "Kidneys and urinary bladder"], "The endocrine system includes the pituitary gland, hypothalamus, adrenal glands, ovaries, and testes."], ["Which organ system makes hormones?", "Endocrine system", ["Nervous system", "Integumentary system", "Immune system"], "The endocrine system produces hormones."]]}, {"id": "k-dig", "t": "body", "term": "Digestive system organs", "note": "DIGESTIVE SYSTEM: ESOPHAGUS, STOMACH, SMALL INTESTINE, LARGE INTESTINE. Digests foods and absorbs NUTRIENTS, MINERALS, VITAMINS, and water.", "qs": [["The esophagus, stomach, small intestine, and large intestine belong to which system?", "Digestive system", ["Urinary system", "Respiratory system", "Lymphatic system"], "These are the major organs of the digestive system."], ["What does the digestive system do?", "Digests foods and absorbs nutrients, minerals, vitamins, and water", ["Brings air to where gas exchange happens", "Removes extra water and salts from the blood", "Produces hormones"], "The digestive system digests foods and absorbs nutrients, minerals, vitamins, and water."], ["Which organ is NOT part of the digestive system?", "Trachea", ["Stomach", "Esophagus", "Small intestine"], "The trachea belongs to the respiratory system."]]}, {"id": "k-resp", "t": "body", "term": "Respiratory system organs", "note": "RESPIRATORY SYSTEM: TRACHEA, LARYNX, PHARYNX, LUNGS. Brings air to sites where gas exchange happens (blood and air in the lungs; blood and cells around the body).", "qs": [["The trachea, larynx, pharynx, and lungs belong to which system?", "Respiratory system", ["Digestive system", "Cardiovascular system", "Lymphatic system"], "These are the major organs of the respiratory system."], ["What does the respiratory system do?", "Brings air to sites where gas exchange can happen", ["Digests food and absorbs nutrients", "Produces gametes", "Defends against infection"], "It brings air to sites where gas exchange can occur."], ["Which of these is a respiratory organ?", "Larynx", ["Esophagus", "Spleen", "Pituitary gland"], "The larynx is part of the respiratory system."]]}, {"id": "k-uri", "t": "body", "term": "Kidneys & bladder (urinary system)", "note": "URINARY SYSTEM: KIDNEYS and urinary BLADDER. Removes extra water, salts, and waste products from the blood; controls pH; controls water and salt balance.", "qs": [["The kidneys and urinary bladder belong to which system?", "Urinary system", ["Digestive system", "Endocrine system", "Lymphatic system"], "The urinary system includes the kidneys and urinary bladder."], ["What does the urinary system do?", "Removes extra water, salts, and wastes from the blood", ["Digests food", "Produces blood cells", "Brings air to the lungs"], "It removes extra water, salts, and waste products from blood and controls water and salt balance."], ["Which organ system controls the body's water and salt balance and pH?", "Urinary system", ["Respiratory system", "Skeletal system", "Nervous system"], "The urinary system controls pH and water and salt balance."]]}, {"id": "k-def", "t": "body", "term": "Lymph nodes, bone marrow, spleen, white blood cells", "note": "LYMPHATIC SYSTEM: LYMPH NODES and LYMPH VESSELS; defends against infection and moves LYMPH. IMMUNE SYSTEM: BONE MARROW, SPLEEN, WHITE BLOOD CELLS; defends against diseases.", "qs": [["Lymph nodes and lymph vessels belong to which system?", "Lymphatic system", ["Immune system", "Cardiovascular system", "Urinary system"], "The lymphatic system includes lymph nodes and lymph vessels."], ["Bone marrow, the spleen, and white blood cells belong to which system?", "Immune system", ["Skeletal system", "Digestive system", "Endocrine system"], "The immune system includes bone marrow, the spleen, and white blood cells."], ["What job do the lymphatic and immune systems share?", "Defending against infection and disease", ["Producing hormones", "Digesting food", "Moving the body"], "Both defend the body against infection and disease."]]}, {"id": "k-gam", "t": "body", "term": "Gametes (reproductive system)", "note": "GAMETES: sex cells. The REPRODUCTIVE SYSTEM produces gametes and sex hormones.", "qs": [["What are gametes?", "Sex cells", ["White blood cells", "Nerve cells", "Hormones"], "The reproductive system produces gametes (sex cells)."], ["Which organ system produces gametes?", "Reproductive system", ["Endocrine system", "Immune system", "Skeletal system"], "The reproductive system produces gametes and sex hormones."], ["The reproductive system produces gametes and…", "Sex hormones", ["White blood cells", "Lymph", "Digestive juices"], "It produces gametes (sex cells) and sex hormones."]]}, {"id": "k-skel", "t": "body", "term": "Skeletal system (ligaments, cartilage)", "note": "SKELETAL SYSTEM: bones, CARTILAGE, LIGAMENTS. Supports and protects soft tissues, produces blood cells, stores MINERALS.", "qs": [["Bones, cartilage, and ligaments belong to which system?", "Skeletal system", ["Muscular system", "Integumentary system", "Immune system"], "The skeletal system includes bones, cartilage, and ligaments."], ["Which organ system produces blood cells and stores minerals?", "Skeletal system", ["Cardiovascular system", "Digestive system", "Urinary system"], "The skeletal system supports and protects soft tissues, produces blood cells, and stores minerals."], ["Cartilage is an example of which tissue type?", "Connective tissue", ["Epithelial tissue", "Muscle tissue", "Nervous tissue"], "Tendon, cartilage, and bone are examples of connective tissue."]]}, {"id": "k-cvs", "t": "cardio", "term": "Cardiovascular system", "note": "CARDIOVASCULAR SYSTEM: the heart, the blood vessels, and the blood. Moves nutrients, gases (like oxygen), hormones, and wastes to and from cells. Main job: deliver oxygen to every cell.", "qs": [["What makes up the cardiovascular system?", "The heart, the blood vessels, and the blood", ["The heart, the lungs, and the trachea", "The brain, the nerves, and the spinal cord", "The kidneys, the bladder, and the blood"], "The cardiovascular system is made up of the heart, the blood vessels, and the blood."], ["What is the MAIN function of the cardiovascular system?", "To deliver oxygen to each of your cells", ["To digest food", "To produce hormones", "To protect the body from injury"], "The main function of the cardiovascular system is to deliver oxygen to each of your cells."], ["Which of these is NOT part of the cardiovascular system?", "The lungs", ["The heart", "The arteries", "The blood"], "The lungs belong to the respiratory system."]]}, {"id": "k-aero", "t": "cardio", "term": "Aerobic exercise (\"cardio\")", "note": "AEROBIC EXERCISE: \"cardio\" is slang for aerobic exercise that raises your heart rate for an extended amount of time, like biking, running, or swimming.", "qs": [["\"Cardio\" is slang for what kind of exercise?", "Aerobic exercise that raises your heart rate for an extended time", ["Lifting the heaviest weight you can once", "Stretching before bed", "Exercise that keeps your heart rate low"], "\"Cardio\" is slang for aerobic exercise that raises your heart rate for an extended amount of time."], ["Which is an example of aerobic exercise?", "Swimming", ["Sleeping", "Reading", "Sitting still"], "Cardio can include biking, running, or swimming."], ["Aerobic exercise raises your…", "Heart rate for an extended amount of time", ["Blood sugar for a few seconds", "Body temperature until you faint", "Number of chromosomes"], "Aerobic exercise raises your heart rate for an extended amount of time."]]}, {"id": "k-nutr", "t": "cardio", "term": "Nutrients", "note": "NUTRIENTS: substances your cells need to survive. The cardiovascular system moves nutrients, gases, and wastes to and from your cells. If cells don't receive nutrients, they cannot survive.", "qs": [["What happens if your cells don't receive nutrients?", "They cannot survive", ["They grow faster", "They turn into viruses", "Nothing changes"], "If your cells don't receive nutrients, they cannot survive."], ["What does the cardiovascular system move to and from your cells?", "Nutrients, gases like oxygen, hormones, and wastes", ["Only oxygen", "Only red blood cells", "Only food and water"], "It moves nutrients, gases, and wastes to and from your cells, and carries hormones."], ["Every cell in your body depends on the cardiovascular system to bring it…", "Nutrients and oxygen", ["New DNA", "Gametes", "Stimuli"], "Every cell depends on the cardiovascular system for nutrients and oxygen."]]}, {"id": "k-cr", "t": "cardio", "term": "Cellular respiration", "note": "CELLULAR RESPIRATION: cells use oxygen to produce ENERGY in the form of ATP. Carbon dioxide is the waste product; blood carries it to the lungs to be exhaled.", "qs": [["Why does every cell in your body need oxygen?", "For cellular respiration, which produces energy (ATP)", ["To make new DNA", "To build a cell wall", "To make hormones"], "Oxygen is used in cellular respiration to produce energy in the form of ATP."], ["Carbon dioxide is a waste product of…", "Cellular respiration", ["Digestion", "Protein synthesis", "Lactic acid fermentation only"], "Carbon dioxide is a waste product of cellular respiration."], ["What does cellular respiration produce?", "Energy in the form of ATP", ["Oxygen", "Hormones", "Red blood cells"], "Cellular respiration produces energy in the form of ATP."]]}, {"id": "k-laf", "t": "cardio", "term": "Lactic acid fermentation", "note": "LACTIC ACID FERMENTATION: what happens in your cells WITHOUT oxygen; it can only be kept up for a brief period of time.", "qs": [["Without oxygen, what would happen in your cells?", "Lactic acid fermentation", ["Cellular respiration", "Protein synthesis", "Photosynthesis"], "Without oxygen, lactic acid fermentation would occur in your cells."], ["How long can lactic acid fermentation be kept up?", "Only for a brief period of time", ["Forever", "For many years", "Only while you sleep"], "It can only be maintained for a brief period of time."], ["Which process happens when cells DON'T have oxygen?", "Lactic acid fermentation", ["Cellular respiration", "Replication", "Homeostasis"], "Cellular respiration needs oxygen; lactic acid fermentation happens without it."]]}, {"id": "k-adr", "t": "cardio", "term": "Adrenal glands & hormones in blood", "note": "HORMONES travel through the blood because they're made in one area and affect another. Example: ADRENALINE, made by the ADRENAL GLANDS on top of the KIDNEYS, quickens the heart rate.", "qs": [["Where are the adrenal glands?", "On top of the kidneys", ["Inside the heart", "Next to the lungs", "At the base of the brain"], "Adrenaline is produced by the adrenal glands on top of the kidneys."], ["What does adrenaline do to the heart?", "It quickens the heart rate", ["It stops the heart", "It slows the heart rate", "It closes the heart valves"], "Adrenaline quickens the heart rate."], ["Why do hormones travel through the blood?", "They are made in one area of the body but affect another area", ["They need to pick up oxygen", "Blood turns them into proteins", "They only work inside the heart"], "Hormones are produced in one area and have an effect on another area."]]}, {"id": "k-atr", "t": "heart", "term": "Atrium / Atria", "note": "ATRIUM (plural ATRIA): one of the two small, thin-walled chambers on the TOP of the heart where blood first ENTERS. The atria RECEIVE blood.", "qs": [["What is an atrium?", "A small, thin-walled chamber on top of the heart where blood first enters", ["A muscular V-shaped chamber that pumps blood out", "A valve between two chambers", "The largest artery in the body"], "An atrium is one of the two small, thin-walled chambers on the top of the heart where blood first enters."], ["What is the job of the atria?", "To receive blood", ["To pump blood out to the body", "To keep blood from flowing backward", "To add oxygen to blood"], "The atria receive the blood, and the ventricles pump it out."], ["\"Atria\" is the plural of…", "Atrium", ["Artery", "Aorta", "Ventricle"], "Atrium is singular for atria."]]}, {"id": "k-ven", "t": "heart", "term": "Ventricle", "note": "VENTRICLE: one of the two MUSCULAR, V-shaped chambers that PUMP blood out of the heart. (V for ventricle.)", "qs": [["What are the ventricles?", "Muscular, V-shaped chambers that pump blood out of the heart", ["Thin-walled chambers that receive blood", "Valves that keep blood flowing one way", "Vessels that return blood to the heart"], "A ventricle is one of the two muscular V-shaped chambers that pump blood out of the heart."], ["Which chambers pump blood out of the heart?", "The ventricles", ["The atria", "The valves", "The vena cavae"], "The ventricles pump the blood out of the heart."], ["What shape are the ventricles, which helps you remember their name?", "V-shaped", ["Round like a ball", "Flat like a disc", "Long and stringy"], "You can remember they are called ventricles because they are shaped like a V."]]}, {"id": "k-chjob", "t": "heart", "term": "The four chambers' jobs", "note": "RIGHT ATRIUM: receives oxygen-poor blood from the body. RIGHT VENTRICLE: pumps it to the lungs. LEFT ATRIUM: receives oxygen-rich blood from the lungs. LEFT VENTRICLE: pumps it to the rest of the body.", "qs": [["Where does oxygen-poor blood from the body first enter the heart?", "The right atrium", ["The left atrium", "The right ventricle", "The left ventricle"], "The right atrium receives oxygen-poor blood from the body."], ["Which chamber pumps oxygen-rich blood out to the rest of the body?", "The left ventricle", ["The right ventricle", "The left atrium", "The right atrium"], "The left ventricle pumps oxygen-rich blood out of the heart to the rest of the body."], ["Which chamber pumps oxygen-poor blood toward the lungs?", "The right ventricle", ["The left ventricle", "The right atrium", "The left atrium"], "The right ventricle pumps oxygen-poor blood toward the lungs."]]}, {"id": "k-valv", "t": "heart", "term": "Valves", "note": "VALVES: keep blood flowing in ONE direction. 4 valves: 2 AV (atrioventricular) valves stop blood going from ventricles back to atria; 2 SL (semilunar) valves in the arteries stop blood flowing back into the ventricles. \"Lub\" = AV valves closing, \"dub\" = SL valves closing.", "qs": [["What is the purpose of the valves in the heart?", "To keep blood flowing in one direction", ["To add oxygen to the blood", "To make new blood cells", "To slow down the heart rate"], "Valves keep the blood flowing in one direction by opening and closing in one direction only."], ["What causes the \"lub-dub\" sound of a heartbeat?", "The valves closing: AV valves (\"lub\"), then SL valves (\"dub\")", ["The atria and ventricles filling up", "Blood hitting the walls of the aorta", "The lungs pushing on the heart"], "\"Lub\" is the AV valves closing and \"dub\" is the SL valves closing."], ["What do the two AV (atrioventricular) valves do?", "Stop blood from moving from the ventricles back into the atria", ["Stop blood from moving from the atria into the ventricles", "Stop blood from flowing from the arteries into the ventricles", "Push blood into the lungs"], "The AV valves stop blood from moving from the ventricles to the atria."]]}, {"id": "k-card", "t": "heart", "term": "Cardiac muscle", "note": "CARDIAC MUSCLE: the heart is mainly made of cardiac muscle. Its cells contract in unison, making the heart contract with enough force to push blood out.", "qs": [["The heart is mainly made of…", "Cardiac muscle", ["Skeletal muscle", "Epithelial tissue", "Bone"], "The heart is mainly composed of cardiac muscle."], ["How do cardiac muscle cells work to pump blood?", "They contract in unison, generating enough force to push blood out", ["They take turns resting so the heart never stops", "They release hormones into the blood", "They filter waste from the blood"], "These muscle cells contract in unison, causing the heart to contract."], ["What happens after the ventricles fill with blood?", "They contract, and blood is pushed out of the heart", ["The atria fill with air", "The valves let blood flow backward", "The heart rests for several minutes"], "After the ventricles fill with blood, they contract, and blood is pushed out of the heart."]]}, {"id": "k-art", "t": "vessels", "term": "Arteries", "note": "ARTERIES: carry blood AWAY from the heart (A = Away). Blood in arteries is under the greatest pressure.", "qs": [["Which blood vessels carry blood away from the heart?", "Arteries", ["Veins", "Capillaries", "The vena cavae"], "Arteries carry blood away from the heart."], ["Memory trick: \"Arteries go Away.\" This means arteries carry blood…", "Away from the heart", ["Toward the heart", "Only to the lungs", "Only through the skin"], "Arteries carry blood away from the heart."], ["Fill in the blanks: ___ carry blood away from the heart and ___ return blood to the heart.", "Arteries; veins", ["Veins; arteries", "Capillaries; arteries", "Veins; capillaries"], "Arteries carry blood away from the heart, while veins return blood to the heart."]]}, {"id": "k-vein", "t": "vessels", "term": "Veins", "note": "VEINS: return blood back TO the heart. Blood in veins is not under much pressure.", "qs": [["Which blood vessels return blood to the heart?", "Veins", ["Arteries", "Capillaries", "The aorta"], "Veins return blood to the heart."], ["A blood vessel that carries blood back TO the heart is a(n)…", "Vein", ["Artery", "Aorta", "Pulmonary artery"], "Veins return blood to the heart."], ["What is the difference between arteries and veins?", "Arteries carry blood away from the heart; veins carry blood back to it", ["Arteries carry blood to the heart; veins carry it away", "Arteries are the smallest vessels; veins are the largest", "Only veins carry blood"], "Arteries carry blood away from the heart, while veins return blood to the heart."]]}, {"id": "k-parts", "t": "vessels", "term": "Pulmonary arteries & pulmonary veins", "note": "PULMONARY ARTERIES: heart → lungs, carry oxygen-POOR blood (the ONLY arteries that do). PULMONARY VEINS: lungs → heart, carry oxygen-RICH blood (the ONLY veins that do).", "qs": [["Which are the only arteries that carry oxygen-poor blood?", "The pulmonary arteries", ["The aorta", "The arteries in the neck", "The vena cavae"], "The pulmonary arteries carry oxygen-poor blood away from the heart to the lungs."], ["Which are the only veins that carry oxygen-rich blood?", "The pulmonary veins", ["The superior vena cava", "The inferior vena cava", "The capillaries"], "The pulmonary veins return oxygen-rich blood from the lungs to the heart."], ["Where do the pulmonary arteries carry blood?", "From the heart to the lungs", ["From the heart to the body", "From the lungs to the heart", "From the head to the heart"], "The pulmonary arteries carry blood away from the heart to the lungs."]]}, {"id": "k-aorta", "t": "vessels", "term": "Aorta", "note": "AORTA: the LARGEST artery in the body. Carries oxygen-rich blood away from the heart (from the left ventricle) and branches into smaller arteries, then capillaries.", "qs": [["What is the largest artery in the body?", "The aorta", ["The pulmonary artery", "The superior vena cava", "A capillary"], "The aorta is the largest artery in the body."], ["Oxygen-rich blood leaves the left ventricle through the…", "Aorta", ["Pulmonary artery", "Superior vena cava", "Pulmonary vein"], "Oxygen-rich blood leaves the left ventricle through the aorta."], ["Farther from the heart, the aorta branches into smaller arteries, which eventually branch into…", "Capillaries", ["Veins", "Atria", "Pulmonary arteries"], "The aorta branches into smaller arteries, which eventually branch into capillaries."]]}, {"id": "k-cap", "t": "vessels", "term": "Capillaries", "note": "CAPILLARIES: the SMALLEST blood vessels. They connect very small arteries and veins. Gases, food, and other substances pass between blood and cells through their very thin walls.", "qs": [["What is the smallest type of blood vessel?", "Capillaries", ["Arteries", "Veins", "The aorta"], "Capillaries are the smallest type of blood vessel."], ["Where are gases exchanged between the blood and the body's cells?", "Across the thin walls of the capillaries", ["Inside the aorta", "Inside the heart's chambers", "Inside the vena cavae"], "Gases and other substances are exchanged across the very thin walls of capillaries."], ["What do capillaries connect?", "Very small arteries and veins", ["The heart and the lungs directly", "The two atria", "The two ventricles"], "Capillaries connect very small arteries and veins."]]}, {"id": "k-vc", "t": "vessels", "term": "Superior & inferior vena cava", "note": "SUPERIOR VENA CAVA: returns oxygen-poor blood from the HEAD. INFERIOR VENA CAVA: returns oxygen-poor blood from the BODY. Both bring blood back to the heart.", "qs": [["Which veins return oxygen-poor blood to the heart?", "The superior vena cava and the inferior vena cava", ["The pulmonary veins", "The aorta", "The pulmonary arteries"], "The veins that return oxygen-poor blood to the heart are the superior and inferior vena cava."], ["The superior vena cava returns blood from the…", "Head", ["Lower body", "Lungs", "Left ventricle"], "The superior vena cava returns blood from the head."], ["The inferior vena cava returns blood from the…", "Body", ["Head", "Lungs", "Brain"], "The inferior vena cava returns blood from the body."]]}, {"id": "k-pulc", "t": "vessels", "term": "Pulmonary circulation", "note": "PULMONARY CIRCULATION: carries blood between the heart and the LUNGS. Right ventricle → pulmonary arteries → lungs (red blood cells release CO₂ and pick up O₂) → pulmonary veins → left side of the heart.", "qs": [["Pulmonary circulation carries blood between the heart and the…", "Lungs", ["Body", "Brain", "Kidneys"], "Pulmonary circulation carries blood between the heart and lungs."], ["Which path is pulmonary circulation?", "Right ventricle → pulmonary arteries → lungs → pulmonary veins → left side of heart", ["Left ventricle → aorta → body → vena cava → right side of heart", "Right atrium → aorta → lungs → vena cava", "Lungs → pulmonary arteries → right ventricle → aorta"], "Oxygen-poor blood leaves the right ventricle through the pulmonary arteries and returns through the pulmonary veins."], ["In the lungs, what do the red blood cells do?", "Release carbon dioxide and pick up oxygen", ["Release oxygen and pick up carbon dioxide", "Pick up nutrients from food", "Make new hormones"], "Once at the lungs, the red blood cells release carbon dioxide and pick up oxygen."]]}, {"id": "k-sysc", "t": "vessels", "term": "Systemic circulation", "note": "SYSTEMIC CIRCULATION: carries oxygen-rich blood from the heart to the BODY and returns oxygen-poor blood. Left ventricle → aorta → organs and tissues (capillaries) → veins → vena cavae → heart.", "qs": [["Systemic circulation carries blood between the heart and the…", "Body", ["Lungs only", "Liver only", "Lungs and trachea"], "Systemic circulation carries blood between the heart and body."], ["Which path is systemic circulation?", "Left ventricle → aorta → body tissues → veins → vena cavae → heart", ["Right ventricle → pulmonary arteries → lungs → pulmonary veins", "Vena cava → aorta → lungs → left atrium", "Lungs → aorta → right atrium → pulmonary veins"], "Oxygen-rich blood leaves the left ventricle through the aorta, travels to the body, and returns to the vena cavae."], ["In systemic circulation, how do tissues and organs absorb oxygen?", "Through the capillaries", ["Through the pulmonary veins", "Directly from the aorta wall", "Through the heart valves"], "The tissues and organs absorb the oxygen through the capillaries."]]}, {"id": "k-bp", "t": "bp", "term": "Blood pressure", "note": "BLOOD PRESSURE: the pressure circulating blood puts on the walls of blood vessels, caused mainly by the heartbeat. Highest in ARTERIES; blood in VEINS is under little pressure. Measured with a sphygmomanometer.", "qs": [["What is blood pressure?", "The pressure circulating blood puts on the walls of blood vessels", ["How fast the heart beats", "How much blood is in the body", "How much oxygen is in the blood"], "Blood pressure occurs when circulating blood puts pressure on the walls of blood vessels."], ["What mainly causes blood pressure?", "The beating of the heart", ["Breathing", "Digesting food", "Moving your muscles"], "Blood pressure is primarily caused by the beating of your heart."], ["In which blood vessels is blood under the greatest pressure?", "Arteries", ["Veins", "Capillaries", "The vena cavae"], "Blood in arteries is under the greatest pressure. Blood in veins is not under much pressure."]]}, {"id": "k-sys", "t": "bp", "term": "Systolic pressure", "note": "SYSTOLIC: the FIRST number; the pressure when the heart BEATS (highest). Healthy: less than 120. Around 115 is linked to fewer health problems.", "qs": [["What is systolic pressure?", "The pressure on blood vessels when the heart beats, the highest pressure", ["The pressure when the heart rests between beats", "The number of heartbeats per minute", "The pressure inside the lungs"], "Systolic pressure is the pressure when the heart beats."], ["In a reading of 120/80, which number is the systolic pressure?", "120", ["80", "200", "40"], "Blood pressure is written systolic/diastolic, so 120 is systolic."], ["What is a healthy
