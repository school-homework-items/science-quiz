<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science Practice Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a lab-notebook page. One centered column, faint graph-paper ground, ink-blue accent. */
:root{
  --paper:#f7f8fb; --sheet:#ffffff; --grid:#e6eaf2; --ink:#1b2333; --muted:#5d6779;
  --line:#d5dbe6; --accent:#2747a0; --accent-soft:#e7ecfa; --artery:#b3263b;
  --ok:#17803d; --ok-soft:#e5f5eb; --bad:#c2410c; --bad-soft:#fdeee6; --warn:#a16207;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11151d; --sheet:#181d27; --grid:#1d2330; --ink:#e7ebf3; --muted:#9aa4b6;
    --line:#2c3443; --accent:#8fa8f0; --accent-soft:#222c46; --artery:#f07a8a;
    --ok:#4ccf7d; --ok-soft:#173224; --bad:#ff8a57; --bad-soft:#3a2117; --warn:#e2b04a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151d; --sheet:#181d27; --grid:#1d2330; --ink:#e7ebf3; --muted:#9aa4b6;
  --line:#2c3443; --accent:#8fa8f0; --accent-soft:#222c46; --artery:#f07a8a;
  --ok:#4ccf7d; --ok-soft:#173224; --bad:#ff8a57; --bad-soft:#3a2117; --warn:#e2b04a; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font:17px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 64px;
}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
a{color:var(--accent)}
.eyebrow{font:700 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--artery)}
.muted{color:var(--muted)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:22px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
button{font:inherit;cursor:pointer}
.btn{border:1.5px solid var(--accent);background:var(--accent);color:var(--sheet);border-radius:8px;padding:10px 18px;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:6px 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lesson-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.lesson-list li{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.lesson-list a{text-decoration:none;font-weight:700}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap}

/* quiz */
.progress{height:8px;background:var(--grid);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qtopic{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;text-decoration:none}
.qtext{font:700 clamp(20px,3.2vw,24px)/1.35 var(--display);margin:14px 0 18px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink)}
.choice:hover{border-color:var(--accent)}
.choice .letter{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-weight:700;font-size:14px}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .letter{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.qnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.map button{padding:6px 0;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.map button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.map button.cur{outline:2px solid var(--artery);outline-offset:1px}
.notice{padding:12px 14px;border-radius:8px;background:var(--bad-soft);border:1px solid var(--bad);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
kbd{font:12px/1 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:var(--paper)}

/* results */
.score{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}
.big{font:800 56px/1 var(--display);font-variant-numeric:tabular-nums}
.big small{font-size:24px;color:var(--muted);font-weight:700}
.topics{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 120px 72px;gap:12px;align-items:center;font-size:15px}
.bar{height:10px;border-radius:99px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.pct{font-variant-numeric:tabular-nums;text-align:right}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:99px;padding:5px 14px;font-size:15px}
.tabs button.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.review{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.ritem{border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:8px;padding:12px 14px;background:var(--sheet)}
.ritem.wrong{border-left-color:var(--bad)}
.ritem .rq{font-weight:700;margin:4px 0 6px}
.ritem .ans{font-size:15px;display:flex;flex-direction:column;gap:2px}
.ritem .why{font-size:15px;color:var(--muted);margin-top:6px}
.term{font-weight:700;font-size:14px;padding:2px 8px;border-radius:4px;background:var(--grid);color:var(--ink)}
.tag-ok{color:var(--ok);font-weight:700}.tag-bad{color:var(--bad);font-weight:700}
.next fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.next legend{font:700 13px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--sheet)}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.opt b{display:block}
.opt span{font-size:15px;color:var(--muted)}
.opt.dis{opacity:.5;cursor:not-allowed}
.subset{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;margin:4px 0 0 30px}
.subset label{display:flex;gap:8px;align-items:center;font-size:15px}
.subset .low{color:var(--bad);font-weight:700;font-size:13px}
.hist{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.hist td,.hist th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.hist th{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.banner{padding:14px 16px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent)}
.banner.win{background:var(--ok-soft);border-color:var(--ok)}
.sr{position:absolute;left:-9999px}
#print{display:none}
@media (max-width:520px){.trow{grid-template-columns:minmax(0,1fr) 70px 64px}.sheet{padding:16px}.big{font-size:44px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* printing: only the notebook sheet */
@page{margin:0.6in}
@media print{
  body{background:#fff;color:#000;padding:0;font-size:12pt}
  #app{display:none!important}
  #print{display:block!important}
  .p-head{border-bottom:2px solid #000;padding-bottom:6pt;margin-bottom:10pt}
  .p-head h1{font-size:18pt}
  .p-item{break-inside:avoid;border-bottom:1px solid #999;padding:8pt 0}
  .p-item .pterm{font-weight:700;font-size:13pt}
  .p-item .pq{font-style:italic}
  .p-item div{margin-top:3pt}
  .p-lbl{font-weight:700;text-transform:uppercase;font-size:9pt;letter-spacing:.05em}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script>
const QUIZ = {"title": "The Heart & Blood", "subtitle": "7th grade science · circulatory system packet", "slug": "heart-and-blood", "source": "the class packet", "topics": [{"id": "parts", "name": "All About Your Heart: Heart Parts"}, {"id": "circ", "name": "All About Your Heart: It's Great to Circulate"}, {"id": "label", "name": "The Heart (labeling page)"}, {"id": "job", "name": "The Heart Has a Job to Do"}, {"id": "blood", "name": "What's in Your Blood?"}, {"id": "flow", "name": "Go with the Flow + Blood Flow diagram"}], "concepts": [{"id": "h-muscle", "t": "parts", "term": "Muscle", "note": "MUSCLE: your heart is really a muscle. It's a little to the LEFT of the middle of your chest and about the SIZE OF YOUR FIST. It's special because it sends blood around your body.", "qs": [["What is your heart really?", "A muscle", ["A bone", "A gland", "A blood vessel"], "The article says: your heart is really a muscle."], ["Where is your heart located?", "A little to the left of the middle of your chest", ["Far on the right side of your chest", "Just below your stomach", "In the middle of your back"], "It's located a little to the left of the middle of your chest."], ["About how big is your heart?", "About the size of your fist", ["About the size of a grape", "About the size of your head", "About the size of a football"], "The heart is about the size of your fist."]]}, {"id": "h-pump", "t": "parts", "term": "Pump (two pumps in one)", "note": "PUMP: the heart is like a pump, or TWO PUMPS IN ONE. RIGHT side: gets blood from the BODY → pumps it to the LUNGS. LEFT side: gets blood from the LUNGS → pumps it to the BODY.", "qs": [["Why is the heart called a pump?", "It pumps blood around your body", ["It pumps air into your lungs", "It pumps food into your stomach", "It pumps thoughts to your brain"], "The heart sends blood around your body. It's like a pump, or two pumps in one."], ["What does the RIGHT side of the heart do?", "Receives blood from the body and pumps it to the lungs", ["Receives blood from the lungs and pumps it to the body", "Pumps blood only to the brain", "Makes new blood cells"], "The right side receives blood from the body and pumps it to the lungs."], ["What does the LEFT side of the heart do?", "Receives blood from the lungs and pumps it out to the body", ["Receives blood from the body and pumps it to the lungs", "Stores extra blood for emergencies", "Separates the heart into two halves"], "The left side does the exact opposite of the right: it receives blood from the lungs and pumps it out to the body."]]}, {"id": "h-beat", "t": "parts", "term": "Heartbeat (fill, then contract)", "note": "HEARTBEAT: before each beat the heart FILLS with blood, then its muscle CONTRACTS (squeezes) to squirt the blood along, like squeezing your hand into a fist. It does this all day and all night.", "qs": [["What happens right before each heartbeat?", "The heart fills with blood", ["The heart empties completely", "The valves are removed", "The heart stops for a minute"], "Before each beat, your heart fills with blood."], ["When the heart contracts, what does it do?", "Squeezes to squirt the blood along", ["Relaxes and gets bigger", "Fills with air", "Makes new blood"], "When the heart contracts, it squeezes, like squeezing your hand into a fist."], ["The article compares a heartbeat to…", "Squeezing your hand into a fist", ["Blowing up a balloon", "Walking through a door", "Delivering lunch"], "Try squeezing your hand into a fist. That's sort of like what your heart does to squirt out the blood."]]}, {"id": "h-chamber", "t": "parts", "term": "Chamber", "note": "CHAMBER: each of the heart's 4 blood-filled areas. 2 chambers on each side: one on TOP (atrium) and one on the BOTTOM (ventricle).", "qs": [["Each of the four blood-filled areas of the heart is called a…", "Chamber", ["Valve", "Septum", "Vessel"], "Each of these areas is called a chamber."], ["How many chambers does the heart have?", "Four", ["Two", "Three", "Six"], "The heart is made up of four different blood-filled areas called chambers."], ["How are the heart's chambers arranged?", "Two on each side, one on top and one on the bottom", ["All four in a row from left to right", "Three on top and one on the bottom", "All four on the left side"], "There are two chambers on each side of the heart, one on top and one on the bottom."]]}, {"id": "h-atria", "t": "parts", "term": "Atria / Atrium", "note": "ATRIA (say: AY-tree-uh): the 2 TOP chambers. One is an ATRIUM. The atria FILL with blood returning to the heart from the body and lungs. The heart has a LEFT ATRIUM and a RIGHT ATRIUM.", "qs": [["What are the two chambers on the top of the heart called?", "Atria", ["Ventricles", "Valves", "Septums"], "The two chambers on top are called the atria."], ["If you're talking about only ONE of the top chambers, you call it an…", "Atrium", ["Atria", "Aorta", "Artery"], "If you're talking only about one, call it an atrium."], ["What is the job of the atria?", "To fill with blood returning to the heart from the body and lungs", ["To squirt blood out to the body and lungs", "To separate the left and right sides", "To keep blood from going backward"], "The atria are the chambers that fill with the blood returning to the heart from the body and lungs."]]}, {"id": "h-vent", "t": "parts", "term": "Ventricles", "note": "VENTRICLES (say: VEN-trih-kulz): the 2 BOTTOM chambers, a LEFT VENTRICLE and a RIGHT VENTRICLE. Their job is to SQUIRT the blood OUT to the body and lungs.", "qs": [["What are the two chambers on the bottom of the heart called?", "Ventricles", ["Atria", "Valves", "Vena cavae"], "The two chambers on the bottom are called the ventricles."], ["What is the job of the ventricles?", "To squirt blood out of the heart to the body and lungs", ["To fill with blood returning from the body", "To separate the two sides of the heart", "To make red blood cells"], "Their job is to squirt out the blood to the body and lungs."], ["Which two ventricles does the heart have?", "A left ventricle and a right ventricle", ["A top ventricle and a bottom ventricle", "A front ventricle and a back ventricle", "Only one ventricle"], "The heart has a left ventricle and a right ventricle."]]}, {"id": "h-team", "t": "parts", "term": "Atria and ventricles work as a team", "note": "TEAMWORK: the ATRIA fill with blood, then DUMP it into the VENTRICLES. The ventricles SQUEEZE, pumping blood out of the heart. While the ventricles squeeze, the atria REFILL for the next contraction.", "qs": [["How do the atria and ventricles work together?", "The atria fill with blood and dump it into the ventricles, which squeeze it out of the heart", ["The ventricles fill first and dump blood into the atria", "They take turns stopping and starting", "The atria pump blood to the body while the ventricles rest"], "The atria fill with blood, then dump it into the ventricles. The ventricles then squeeze, pumping blood out."], ["What are the atria doing while the ventricles are squeezing?", "Refilling and getting ready for the next contraction", ["Squeezing at the same time", "Closing forever", "Pumping blood to the lungs"], "While the ventricles are squeezing, the atria refill and get ready for the next contraction."], ["After the atria fill with blood, where do they dump it?", "Into the ventricles", ["Into the lungs", "Into the aorta", "Into the septum"], "The atria fill with blood, then dump it into the ventricles."]]}, {"id": "h-septum", "t": "parts", "term": "Septum", "note": "SEPTUM (say: SEP-tum): a thick wall of muscle running down the MIDDLE of the heart. Its job is to SEPARATE the left side and the right side.", "qs": [["What is the thick wall of muscle running down the middle of the heart called?", "Septum", ["Atrium", "Valve", "Aorta"], "Running down the middle of the heart is a thick wall of muscle called the septum."], ["What is the septum's job?", "To separate the left side and the right side of the heart", ["To pump blood to the lungs", "To keep blood from flowing backward", "To fill with blood from the body"], "The septum's job is to separate the left side and the right side of the heart."], ["What is the septum made of?", "Muscle", ["Bone", "Fat", "Cartilage"], "The septum is a thick wall of muscle."]]}, {"id": "h-valves", "t": "parts", "term": "Valves", "note": "VALVES: 4 special valves inside the heart. A valve lets something IN and keeps it there by CLOSING, like a door that shuts behind you so you can't go BACKWARD. Valves keep blood flowing the right way.", "qs": [["How many special valves are inside the heart?", "Four", ["Two", "One", "Eight"], "Your blood relies on four special valves inside the heart."], ["Why are valves important?", "They keep blood moving the right way and stop it from going backward", ["They add oxygen to the blood", "They pump blood to the lungs", "They separate the left and right sides"], "A valve lets something in and keeps it there by closing, so blood can't go backward."], ["The article compares a valve to…", "A door that shuts behind you so you can't go backward", ["A fist that squeezes", "A truck delivering lunch", "A pump with two sides"], "Think of walking through a door. The door shuts behind you and keeps you from going backward."]]}, {"id": "c-vessels", "t": "circ", "term": "Blood vessels", "note": "BLOOD VESSELS: the tubes blood moves through. ARTERIES and VEINS together are called blood vessels, and they are attached to the heart.", "qs": [["Arteries and veins together are called…", "Blood vessels", ["Chambers", "Valves", "Atria"], "Blood moves through many tubes called arteries and veins, which together are called blood vessels."], ["What are blood vessels?", "Tubes that blood moves through, such as arteries and veins", ["The four chambers of the heart", "Cells that fight germs", "The wall between the two sides of the heart"], "Blood moves through many tubes called arteries and veins: blood vessels."], ["Where are blood vessels attached?", "To the heart", ["To the lungs only", "To the stomach", "They aren't attached to anything"], "These blood vessels are attached to the heart."]]}, {"id": "c-arteries", "t": "circ", "term": "Arteries (AWAY from)", "note": "ARTERIES: blood vessels that carry blood AWAY FROM the heart. (A = Away.)", "qs": [["Do arteries carry blood to the heart or away from the heart?", "Away from the heart", ["To the heart", "Only between the two atria", "Only to the brain"], "The blood vessels that carry blood away from the heart are called arteries."], ["Blood vessels that carry blood AWAY FROM the heart are called…", "Arteries", ["Veins", "Capillaries", "Chambers"], "Those are arteries."], ["Memory trick: \"A for Arteries, A for ___.\"", "Away from the heart", ["Atrium", "Air", "Arms only"], "Arteries carry blood away from the heart."]]}, {"id": "c-veins", "t": "circ", "term": "Veins (BACK to)", "note": "VEINS: blood vessels that carry blood BACK TO the heart.", "qs": [["Do veins carry blood to the heart or away from the heart?", "Back to the heart", ["Away from the heart", "Only to the lungs", "Only to the legs"], "The ones that carry blood back to the heart are called veins."], ["Blood vessels that carry blood BACK to the heart are called…", "Veins", ["Arteries", "Ventricles", "The aorta"], "Those are veins."], ["Which statement is correct?", "Arteries carry blood away from the heart; veins carry it back to the heart", ["Arteries carry blood back to the heart; veins carry it away", "Both carry blood only away from the heart", "Both carry blood only back to the heart"], "Arteries = away from. Veins = back to."]]}, {"id": "c-circ", "t": "circ", "term": "Circulation", "note": "CIRCULATION (say: sur-kyoo-LAY-shun): the movement of blood through the heart and around the body. The heart takes LESS THAN 60 SECONDS to pump blood to every cell in your body.", "qs": [["The movement of blood through the heart and around the body is called…", "Circulation", ["Respiration", "Digestion", "Contraction"], "The movement of the blood through the heart and around the body is called circulation."], ["How long does it take your heart to pump blood to every cell in your body?", "Less than 60 seconds", ["About an hour", "About a day", "About 10 minutes"], "It takes less than 60 seconds to pump blood to every cell in your body."], ["If oxygen-rich blood doesn't circulate as it should, what could happen?", "A person could die", ["Nothing at all", "The person would just get sleepy", "The heart would grow bigger"], "If that oxygen-rich blood doesn't circulate as it should, a person could die."]]}, {"id": "c-oxygen", "t": "circ", "term": "Oxygen", "note": "OXYGEN: the most important chemical blood carries to the body. Blood delivers oxygen to ALL the body's cells. WITHOUT oxygen, cells would DIE. The LEFT side of the heart sends oxygen-rich blood to the body.", "qs": [["What is the most important chemical that blood carries to the rest of the body?", "Oxygen", ["Carbon dioxide", "Salt", "Water"], "Blood delivers oxygen to all the body's cells."], ["What would happen to your cells without oxygen?", "They would die", ["They would grow faster", "They would turn into blood", "Nothing would change"], "Without oxygen, these cells would die."], ["Which side of the heart sends oxygen-rich blood out to the body?", "The left side", ["The right side", "The top", "Neither side"], "The left side of your heart sends that oxygen-rich blood out to the body."]]}, {"id": "c-co2", "t": "circ", "term": "Carbon dioxide", "note": "CARBON DIOXIDE: the WASTE chemical made when the body's cells use oxygen. It gets carried away by the blood. Like the blood delivers LUNCH (oxygen) and then picks up the TRASH (carbon dioxide).", "qs": [["What waste chemical is made when the body's cells use oxygen?", "Carbon dioxide", ["Oxygen", "Hemoglobin", "Plasma"], "When the cells use the oxygen, they make carbon dioxide."], ["What happens to the carbon dioxide made by your cells?", "It gets carried away by the blood", ["It stays y artery and comes back by the pulmonary veins into the left atrium."]]}, {"id": "f-left", "t": "flow", "term": "Left ventricle → aorta", "note": "LEFT SIDE PATH: left atrium → (pressure builds) LEFT ATRIOVENTRICULAR VALVE → LEFT VENTRICLE → (ventricle contracts) LEFT SEMILUNAR VALVE → AORTA.", "qs": [["After the left atrium, blood flows through the left atrioventricular valve into the…", "Left ventricle", ["Right ventricle", "Aorta", "Pulmonary artery"], "Again, the pressure builds and the blood flows through the left atrioventricular valve into the left ventricle."], ["What happens when the left ventricle contracts?", "Blood is pushed through the left semilunar valve into the aorta", ["Blood goes back into the left atrium", "Blood goes to the lungs", "Blood goes into the vena cava"], "The ventricle contracts, pushing the blood through the left semilunar valve into the aorta."], ["Which is the correct order for the left side of the heart?", "Left atrium → left AV valve → left ventricle → left semilunar valve → aorta", ["Left ventricle → left atrium → aorta → left AV valve", "Aorta → left semilunar valve → left atrium → left ventricle", "Left atrium → aorta → left ventricle → pulmonary vein"], "That is the path on page 32, steps 7–11."]]}, {"id": "f-order", "t": "flow", "term": "The whole path of blood (Go with the Flow Part II)", "note": "FULL PATH: 1 right atrium → 2 right AV valve → 3 right ventricle → 4 right semilunar valve → 5 pulmonary artery → (lungs) → 6 pulmonary vein → 7 left atrium → 8 left AV valve → 9 left ventricle → 10 left semilunar valve → 11 aorta → (capillary beds) → 12 superior & inferior vena cava → back to 1.", "qs": [["Which comes right AFTER the right ventricle?", "Right semilunar valve", ["Left atrium", "Aorta", "Right atrioventricular valve"], "Right ventricle (3) → right semilunar valve (4) → pulmonary artery (5)."], ["Which comes right BEFORE the aorta?", "Left semilunar valve", ["Left atrium", "Pulmonary vein", "Right ventricle"], "Left xygenated blood\" mean?", "Blood that is rich in oxygen", ["Blood that has no oxygen", "Blood that is only plasma", "Blood that has stopped moving"], "Oxygenated blood is oxygen-rich, like blood that just came from the lungs."], ["On the Blood Flow diagram, which side of the heart holds deoxygenated blood?", "The right side", ["The left side", "Both sides equally", "Neither side"], "The right side collects oxygen-poor blood from the body and sends it to the lungs."], ["On the Blood Flow diagram, which vessels carry deoxygenated blood back from the body capillaries?", "Veins", ["Arteries", "The aorta", "The pulmonary veins"], "Veins bring deoxygenated blood back from the body to the heart."]]}, {"id": "f-cycle", "t": "flow", "term": "Cardiac cycle", "note": "CARDIAC CYCLE: the whole trip of blood through the heart, to the lungs, back, out to the body, and back again. When blood returns through the vena cavae, the cardiac cycle BEGINS ALL OVER AGAIN.", "qs": [["When blood returns to the heart through the vena cavae, what happens?", "The cardiac cycle begins all over again", ["The blood leaves the body", "The heart stops", "The blood turns into plasma"], "The cardiac cycle begins all over again."], ["\"Cardiac\" refers to the…", "Heart", ["Lungs", "Blood cells", "Brain"], "Cardiac means having to do with the heart, as in cardiac cycle."], ["Which statement about the cardiac cycle is true?", "It repeats over and over, all day and all night", ["It happens once a day", "It only happens during exercise", "It only involves the lungs"], "The cycle begins all over again; the heart does this all day and all night."]]}], "nav": [{"label": "Past quizzes →", "href": "past-quizzes.html"}]};

  const items = cids.map(cid=> makeItem(cid, first ? 0 : variantFor(cid, true)));
  newRound(cids.length===QUIZ.concepts.length ? "full" : "subset", items,
    cids.length===QUIZ.concepts.length ? (first ? "Full test" : "Full test · new questions") : "Chosen lessons · new questions");
}

/* Fresh start: wipe history, pick a random version of every question
   (different from the last one he saw), and begin a full test. */
function startOver(){
  const items = QUIZ.concepts.map(c=>{
    const n=c.qs.length, last=S.lastVariant[c.id];
    let vi=Math.floor(Math.random()*n);
    if(n>1 && vi===last) vi=(vi+1+Math.floor(Math.random()*(n-1)))%n;
    return makeItem(c.id, vi);
  });
  S.history=[]; S.lastVariant={};
  newRound("full", items, "Fresh start");
}

/* ---------- views ---------- */
function render(){
  const app = $("#app");
  if(S.view==="quiz" && S.round && !S.round.submitted) app.innerHTML = viewQuiz();
  else if(S.view==="results" && S.round && S.round.submitted) app.innerHTML = viewResults();
  else { S.view="home"; app.innerHTML = viewHome(); }
  bind();
}

function chip(t){
  return t.url ? `<a class="chip" href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)} ↗</a>` : `<span class="chip">${esc(t.name)}</span>`;
}
function navLinks(){
  const n = QUIZ.nav || [];
  return n.length ? `<nav class="row" style="font-size:15px">${n.map(l=>`<a href="${esc(l.href)}">${esc(l.label)}</a>`).join('<span class="muted">·</span>')}</nav>` : "";
}
function header(){
  return `<header class="spread"><div><div class="eyebrow">${esc(QUIZ.subtitle)}</div><h1>${esc(QUIZ.title)}</h1></div></header>`;
}
function lessonsList(withCounts){
  return `<ul class="lesson-list">${QUIZ.topics.map(t=>{
    const n = QUIZ.concepts.filter(c=>c.t===t.id).length;
    return `<li>${t.url?`<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)} ↗</a>`:`<b>${esc(t.name)}</b>`}${withCounts?`<span class="count">${n} Q</span>`:""}</li>`;}).join("")}</ul>`;
}
function historyTable(){
  if(!S.history.length) return "";
  return `<section class="sheet"><h2>Attempt history</h2><div style="overflow-x:auto;margin-top:10px"><table class="hist"><thead><tr><th>#</th><th>Round</th><th>Score</th><th>When</th></tr></thead><tbody>${
    S.history.slice().reverse().map(h=>`<tr><td>${h.num}</td><td>${esc(h.label)}</td><td><b>${h.right}/${h.total}</b> · ${pct(h.right,h.total)}%</td><td class="muted">${new Date(h.when).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</td></tr>`).join("")
  }</tbody></table></div></section>`;
}
function viewHome(){
  const total = QUIZ.concepts.length;
  const r = S.round, resumable = r && !r.submitted;
  return `${header()}
  ${resumable?`<div class="banner spread"><div><b>Quiz in progress:</b> ${esc(r.label)}, ${Object.keys(r.answers).length} of ${r.items.length} answered.</div><button class="btn small" data-act="resume">Keep going</button></div>`:""}
  <section class="sheet" style="display:flex;flex-direction:column;gap:16px">
    <p style="margin:0">${total} multiple-choice questions, one for each <b>key term</b> in ${QUIZ.source?esc(QUIZ.source):"these "+QUIZ.topics.length+" lessons"}. It's open book: each question tells you which ${QUIZ.source?"part of "+esc(QUIZ.source):"lesson"} to look in${QUIZ.topics.some(t=>t.url)?", and the lesson name is a link":""}.</p>
    ${lessonsList(true)}
    <div class="row">
      <button class="btn" data-act="start">${S.history.length?"Start a new full test":"Start the test"}</button>
      <button class="btn ghost" data-act="choose">Choose lessons</button>
      <button class="btn ghost" data-act="printall">Print study notes</button>
      ${S.history.length?`<button class="btn ghost" data-act="scratchask">Start over from scratch</button>`:""}
    </div>
    <div id="scratchconfirm" hidden class="notice"><span>This clears all scores and history and starts a brand-new full test.</span><button class="btn small" data-act="scratch">Yes, start over</button><button class="btn small ghost" data-act="scratchno">Cancel</button></div>
    <div id="chooser" hidden>${subsetPicker(null)}<div class="row" style="margin-top:10px"><button class="btn small" data-act="startsubset">Start with these lessons</button></div></div>
    <p class="muted" style="margin:0;font-size:15px">Tip: press <kbd>A</kbd>–<kbd>D</kbd> to answer and <kbd>←</kbd> <kbd>→</kbd> to move between questions. Your progress is saved in this browser if you close the page.</p>
  </section>
  ${historyTable()}
  ${navLinks()}`;
}

function viewQuiz(){
  const r = S.round, it = r.items[r.pos], c = CON[it.cid], q = c.qs[it.vi], t = TOP[c.t];
  const choices = [q[1], ...q[2]];
  const answered = Object.keys(r.answers).length, sel = r.answers[r.pos];
  const unanswered = r.items.length - answered;
  return `${header()}
  <section class="sheet">
    <div class="spread"><b>${esc(r.label)}</b><span class="count">Question ${r.pos+1} of ${r.items.length} · ${answered} answered</span></div>
    <div class="progress" style="margin-top:10px"><i style="width:${pct(answered,r.items.length)}%"></i></div>
  </section>
  <section class="sheet">
    <div class="qtopic"><span class="muted">Look in:</span>${chip(t)}</div>
    <div class="qtext" id="qtext">${esc(q[0])}</div>
    <div class="choices" role="radiogroup" aria-labelledby="qtext">
      ${it.order.map((ci,k)=>`<button class="choice${sel===ci?" sel":""}" role="radio" aria-checked="${sel===ci}" data-choice="${ci}"><span class="letter">${LETTERS[k]}</span><span>${esc(choices[ci])}</span></button>`).join("")}
    </div>
    <div class="qnav">
      <button class="btn ghost" data-act="prev" ${r.pos===0?"disabled":""}>← Back</button>
      ${r.pos<r.items.length-1?`<button class="btn" data-act="next">Next →</button>`:`<button class="btn" data-act="submit">Finish &amp; see results</button>`}
    </div>
  </section>
  <section class="sheet">
    <div class="spread"><h3>All questions</h3><button class="btn small ghost" data-act="submit">Finish now</button></div>
    <div id="confirm"></div>
    <div class="map" style="margin-top:12px">${r.items.map((x,i)=>`<button data-go="${i}" class="${r.answers[i]!=null?"done":""} ${i===r.pos?"cur":""}" aria-label="Question ${i+1}${r.answers[i]!=null?", answered":""}">${i+1}</button>`).join("")}</div>
    <div class="row" style="margin-top:14px"><button class="btn small ghost" data-act="home">Save &amp; exit</button>${unanswered?`<span class="muted" style="font-size:15px">${unanswered} still blank</span>`:""}</div>
  </section>`;
}

function grade(r){
  return r.items.map((it,i)=>({i, it, c:CON[it.cid], q:CON[it.cid].qs[it.vi], chosen:r.answers[i], ok:r.answers[i]===0}));
}
function byTopic(g){
  const m = {};
  g.forEach(x=>{ const t=x.c.t; (m[t] ||= {right:0,total:0}); m[t].total++; if(x.ok) m[t].right++; });
  return QUIZ.topics.filter(t=>m[t.id]).map(t=>({t, ...m[t.id], p:pct(m[t.id].right,m[t.id].total)}));
}
function subsetPicker(topicStats){
  const stat = topicStats ? Object.fromEntries(topicStats.map(s=>[s.t.id,s])) : {};
  return `<div class="subset" id="subset">${QUIZ.topics.map(t=>{
    const s = stat[t.id], low = s && s.p<80, n = QUIZ.concepts.filter(c=>c.t===t.id).length;
    const checked = topicStats ? low : true;
    return `<label><input type="checkbox" name="topic" value="${t.id}" ${checked?"checked":""}> ${esc(t.name)} <span class="count">(${n})</span>${low?` <span class="low">${s.p}%</span>`:""}</label>`;}).join("")}</div>`;
}

function viewResults(){
  const r = S.round, g = grade(r), right = g.filter(x=>x.ok).length, wrong = g.length-right;
  const topics = byTopic(g);
  const shown = g.filter(x=> S.filter==="all" || (S.filter==="wrong" ? !x.ok : x.ok));
  const mastery = r.kind==="mastery";
  const defNext = wrong ? (mastery ? "mastery" : "missed") : "fresh";
  const barColor = p=> p>=80 ? "var(--ok)" : p>=60 ? "var(--warn)" : "var(--bad)";
  return `${header()}
  ${mastery ? (wrong
     ? `<div class="banner"><b>Mastery mode:</b> ${wrong} concept${wrong>1?"s":""} still to master. The next round asks them again with different wording.</div>`
     : `<div class="banner win"><b>Mastered!</b> Every concept in this mastery run has now been answered correctly.</div>`) : ""}
  <section class="sheet">
    <div class="eyebrow">Round ${r.num} · ${esc(r.label)}</div>
    <div class="score" style="margin-top:10px">
      <div class="big">${right}<small> / ${g.length}</small></div>
      <div><div style="font:700 24px/1 var(--display)">${pct(right,g.length)}%</div><div class="muted">${right} right · ${wrong} to fix</div></div>
      <div style="margin-left:auto"><a href="#next" class="btn small ghost" style="text-decoration:none;display:inline-block">Jump to next steps ↓</a></div>
    </div>
    ${topics.length>1?`<div class="topics">${topics.map(s=>`<div class="trow"><span>${esc(s.t.name)}</span><span class="bar"><i style="width:${s.p}%;background:${barColor(s.p)}"></i></span><span class="pct">${s.right}/${s.total}</span></div>`).join("")}</div>`:""}
  </section>

  <section class="sheet">
    <div class="spread"><h2>What was right and wrong</h2>
      <div class="tabs" role="tablist">
        <button data-filter="all" class="${S.filter==="all"?"on":""}">All (${g.length})</button>
        <button data-filter="wrong" class="${S.filter==="wrong"?"on":""}">Wrong (${wrong})</button>
        <button data-filter="right" class="${S.filter==="right"?"on":""}">Right (${right})</button>
      </div></div>
    <div class="review">${shown.length? shown.map(x=>{
      const choices=[x.q[1],...x.q[2]], t=TOP[x.c.t];
      return `<article class="ritem${x.ok?"":" wrong"}">
        <div class="row" style="gap:8px"><span class="${x.ok?"tag-ok":"tag-bad"}">${x.ok?"✓ Right":"✗ Wrong"}</span><span class="count">Q${x.i+1}</span><span class="term">${esc(termOf(x.c))}</span>${chip(t)}</div>
        <div class="rq">${esc(x.q[0])}</div>
        <div class="ans">${x.ok?`<div>Answer: <b>${esc(choices[0])}</b></div>`:
          `<div>Your answer: <span class="tag-bad">${x.chosen==null?"(left blank)":esc(choices[x.chosen])}</span></div><div>Correct answer: <b class="tag-ok">${esc(choices[0])}</b></div>`}</div>
        <div class="why">${esc(x.q[3])}</div></article>`;}).join("") : `<p class="muted">Nothing here.</p>`}</div>
  </section>

  <section class="sheet next" id="next">
    <h2 style="margin-bottom:14px">Next steps</h2>
    <form id="nextform" style="display:flex;flex-direction:column;gap:18px">
      <fieldset><legend>Also do</legend>
        <label class="opt${wrong?"":" dis"}"><input type="checkbox" id="o-print" ${wrong?"":"disabled"}><div><b>Print notebook sheet</b><span>Each missed question with the correct answer, a notebook note to copy, and the lesson to find it in.</span></div></label>
        <label class="opt"><input type="checkbox" id="o-shuffle" checked><div><b>Shuffle answer order</b><span>For repeated questions, so the right answer isn't in the same spot (stops "it was C" memorizing).</span></div></label>
      </fieldset>
      <fieldset><legend>Next round (pick one)</legend>
        ${radio("missed","Retake the questions I missed",`The same ${wrong} question${wrong===1?"":"s"}.`, !wrong, defNext)}
        ${radio("mastery","Keep going until mastered",`The ${wrong} missed concept${wrong===1?"":"s"} with new wording each round, repeating until every one is right.`, !wrong, defNext)}
        ${radio("same","Retake this same test",`All ${g.length} questions again, exactly as they were.`, false, defNext)}
        ${radio("fresh","New questions on every concept",`A fresh set of ${QUIZ.concepts.length} questions on all the same concepts.`, false, defNext)}
        ${radio("subset","New questions on lessons I choose","Lessons scored under 80% are pre-checked.", false, defNext)}
        <div id="subsetwrap" hidden>${subsetPicker(topics)}</div>
        ${radio("scratch","Start over from scratch","A brand-new full test with different wording that ignores past results. Clears the score history, as if he'd never taken it.", false, defNext)}
        ${radio("none","No new round right now","Go back to the start page.", false, defNext)}
      </fieldset>
      <div class="row"><button class="btn" type="submit" id="go">Start</button><button class="btn ghost" type="button" data-act="copy">Copy missed questions as text</button><span id="copymsg" class="muted" style="font-size:15px"></span></div>
    </form>
  </section>
  ${historyTable()}`;
}
function radio(v,title,sub,dis,def){
  return `<label class="opt${dis?" dis":""}"><input type="radio" name="next" value="${v}" ${dis?"disabled":""} ${v===def?"checked":""}><div><b>${title}</b><span>${sub}</span></div></label>`;
}

/* ---------- actions ---------- */
function answer(ci){ const r=S.round; r.answers[r.pos]=ci; save(); render(); }
function go(i){ const r=S.round; r.pos=Math.max(0,Math.min(r.items.length-1,i)); save(); render(); }
function trySubmit(force){
  const r=S.round, blank=r.items.length-Object.keys(r.answers).length;
  if(blank && !force){
    $("#confirm").innerHTML = `<div class="notice" style="margin-top:12px"><span>${blank} question${blank>1?"s are":" is"} still blank and will count as wrong.</span><button class="btn small" data-act="forcesubmit">Finish anyway</button><button class="btn small ghost" data-act="firstblank">Go to first blank</button></div>`;
    bind(); $("#confirm").scrollIntoView({block:"nearest"}); return;
  }
  r.submitted=true;
  const g=grade(r);
  S.history.push({num:r.num,label:r.label,right:g.filter(x=>x.ok).length,total:g.length,when:Date.now()});
  if(S.history.length>40) S.history=S.history.slice(-40);
  S.view="results"; save(); render(); window.scrollTo(0,0);
}

function printSheet(items, title){
  const today = new Date().toLocaleDateString([], {month:"long",day:"numeric",year:"numeric"});
  $("#print").innerHTML = `<div class="p-head"><h1>${esc(title)}</h1><div>${esc(QUIZ.title)} · ${today}</div></div>` +
    items.map((x,n)=>{ const t=TOP[x.c.t];
      return `<div class="p-item">
        <div class="pterm">${n+1}. ${esc(termOf(x.c))}</div>
        ${x.q?`<div class="pq">${esc(x.q[0])}</div>`:""}
        ${x.q?`<div><span class="p-lbl">Answer:</span> ${esc(x.q[1])}</div>`:""}
        <div><span class="p-lbl">Notebook:</span> ${esc(x.c.note)}</div>
        <div><span class="p-lbl">Find it in:</span> ${esc(t.name)}</div></div>`; }).join("");
  setTimeout(()=>window.print(), 50);
}
function missedText(){
  const g=grade(S.round).filter(x=>!x.ok);
  return g.map((x,n)=>`${n+1}. KEY TERM: ${termOf(x.c)}\n   ${x.q[0]}\n   Answer: ${x.q[1]}\n   Notebook: ${x.c.note}\n   Find it in: ${TOP[x.c.t].name}`).join("\n\n");
}

function doNext(e){
  e.preventDefault();
  const r=S.round, g=grade(r), missed=g.filter(x=>!x.ok);
  const doPrint=$("#o-print")?.checked, shuf=$("#o-shuffle").checked;
  const choice=(new FormData($("#nextform"))).get("next");
  if(doPrint && missed.length) printSheet(missed, `Notebook log · Round ${r.num} (${g.length-missed.length}/${g.length})`);
  const reorder = it => ({cid:it.cid, vi:it.vi, order: shuf ? shuffle([0,1,2,3]) : it.order.slice()});
  const after = ()=>{
    if(choice==="missed") newRound("missed", missed.map(x=>reorder(x.it)), "Missed questions");
    else if(choice==="mastery") newRound("mastery", missed.map(x=>makeItem(x.it.cid, variantFor(x.it.cid,true))), "Mastery round");
    else if(choice==="same") newRound(r.kind==="mastery"?"same":r.kind, r.items.map(reorder), r.label.replace(/ \(retake\)$/,"")+" (retake)");
    else if(choice==="fresh") startFull(true);
    else if(choice==="subset"){
      const ids=[...document.querySelectorAll('#subset input[name=topic]:checked')].map(i=>i.value);
      if(!ids.length){ $("#copymsg").textContent="Pick at least one lesson."; return; }
      startFull(true, QUIZ.concepts.filter(c=>ids.includes(c.t)).map(c=>c.id));
    } else if(choice==="scratch") startOver();
    else { S.view="home"; save(); render(); window.scrollTo(0,0); }
  };
  // let the print dialog open on the results page before switching views
  if(doPrint && missed.length) setTimeout(after, 400); else after();
}

function bind(){
  document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>answer(+b.dataset.choice));
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
  document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.filter;save();render();});
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=ev=>{
    const a=b.dataset.act;
    if(a==="start") startFull(S.history.length>0);
    if(a==="choose"){ $("#chooser").hidden=!$("#chooser").hidden; }
    if(a==="scratchask"){ $("#scratchconfirm").hidden=false; }
    if(a==="scratchno"){ $("#scratchconfirm").hidden=true; }
    if(a==="scratch") startOver();
    if(a==="startsubset"){
      const ids=[...document.querySelectorAll('#subset input[name=topic]:checked')].map(i=>i.value);
      if(ids.length) startFull(S.history.length>0, QUIZ.concepts.filter(c=>ids.includes(c.t)).map(c=>c.id));
    }
    if(a==="printall") printSheet(QUIZ.concepts.map(c=>({c})), "Study notes · every concept");
    if(a==="resume"){ S.view="quiz"; save(); render(); }
    if(a==="prev") go(S.round.pos-1);
    if(a==="next") go(S.round.pos+1);
    if(a==="submit") trySubmit(false);
    if(a==="forcesubmit") trySubmit(true);
    if(a==="firstblank"){ const r=S.round; const i=r.items.findIndex((x,k)=>r.answers[k]==null); go(i); }
    if(a==="home"){ S.view="home"; save(); render(); }
    if(a==="copy"){
      const txt=missedText()||"Nothing missed!";
      const done=m=>{$("#copymsg").textContent=m;};
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>done("Copied."),()=>done("Couldn't copy here."));
    }
  });
  const f=$("#nextform");
  if(f){
    f.onsubmit=doNext;
    const sync=()=>{
      const v=(new FormData(f)).get("next");
      $("#subsetwrap").hidden = v!=="subset";
      const p=$("#o-print")?.checked;
      const labels={missed:"Start missed questions",mastery:"Start mastery round",same:"Start retake",fresh:"Start new test",subset:"Start chosen lessons",scratch:"Start over",none:"Done"};
      $("#go").textContent = (p ? (v==="none"?"Print":"Print & ") : "") + (p&&v==="none" ? "" : (p?labels[v].toLowerCase():labels[v]));
    };
    f.onchange=sync; sync();
  }
}
document.addEventListener("keydown",e=>{
  if(S.view!=="quiz"||!S.round||S.round.submitted) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key.toUpperCase(), it=S.round.items[S.round.pos];
  const idx = "ABCD".indexOf(k)>=0 ? "ABCD".indexOf(k) : "1234".indexOf(k);
  if(idx>=0){ answer(it.order[idx]); }
  else if(e.key==="ArrowRight") go(S.round.pos+1);
  else if(e.key==="ArrowLeft") go(S.round.pos-1);
});
render();
})();
</script>
</body>
</html>
